name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # check-model-columns.py diffs against HEAD~1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # ⭐ STATIC GATES RUN BEFORE THE SUITE, because the suite is what missed
      # the defect they exist to catch: three functions lost a local import and
      # a binding, 611 tests stayed green, and production returned HTTP 500.
      - name: unbound names (closure-aware; blind to conditional binding)
        run: python scripts/check-unbound-names.py
      - name: route shadowing
        run: python scripts/check-route-shadowing.py
      # ⭐ A MODEL COLUMN WITHOUT A MIGRATION LINE TAKES EVERY READ OF THAT TABLE
      # DOWN, and the suite cannot see it: tests build SQLite from the models via
      # create_all(), so the test schema always has the column. 796 green tests
      # shipped a 500 on four anonymous demo surfaces. Needs two commits of
      # history — fetch-depth: 0 above.
      - name: model columns have migration lines
        run: python scripts/check-model-columns.py
      # ⭐ THE BACKEND HALF OF THE PERIOD-LABEL CONTRACT, AND THE ONE THAT FAILS
      # OPEN. This script checks the emitter set FIRST and hard-fails before it
      # ever looks at the frontend, so it is fully meaningful here: a sixth
      # `period_labels` emitter appearing with no endpoint mapping breaks the
      # build. That is exactly the defect this lane fixed — labels emitted by the
      # backend that no frontend fetch ever publishes — and it originates in THIS
      # repo. The frontend scan inside it skips (see below); the cross-check does
      # not.
      - name: period_labels emitter cross-check (backend half — enforced)
        run: python scripts/check-period-labels-published.py
      # ⭐ THE FOLLOWING GATE DOES NOT ENFORCE ANYTHING ON THIS RUNNER, AND SAYING
      # SO IS THE POINT. It reads the sibling `optimization-anchor` checkout via
      # AXIOM_FRONTEND, which does not exist in CI, so it skips. It was wired here
      # when it was written and has never checked a single file. It is kept
      # because it costs nothing and becomes real the moment a frontend checkout
      # is added — but a green tick on this step is NOT coverage, and the step
      # name has to carry that or the run reads as proof it isn't.
      # Real enforcement for the TS-side gates is the pre-push hook in the
      # frontend repo (.githooks/pre-push). See docs/reports/2026-07-29-two-outstanding.md.
      - name: no period formatting in TypeScript (SKIPS — no frontend checkout in CI)
        run: python scripts/check-no-ts-period-format.py
      - run: pytest -q
      # Proves the tests guarding the assessment read path are not vacuous, by
      # reintroducing a plausible defect per test and requiring each to fail.
      # A test never observed failing is not evidence.
      - name: mutation check
        run: python scripts/mutation_check.py
