name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # check-model-columns.py diffs against HEAD~1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # ⭐ STATIC GATES RUN BEFORE THE SUITE, because the suite is what missed
      # the defect they exist to catch: three functions lost a local import and
      # a binding, 611 tests stayed green, and production returned HTTP 500.
      - name: unbound names (closure-aware; blind to conditional binding)
        run: python scripts/check-unbound-names.py
      # ⭐⭐ A FUNCTION-LEVEL IMPORT IS INVISIBLE TO EVERY IMPORT-TIME CHECK.
      # `from .... import frequency_views` shipped at 265aff5 and returned 500 on
      # every call the endpoint ever had: the module imported cleanly, the app
      # built cleanly, 33 tests passed because they import the module DIRECTLY,
      # and the browser proof stubs the endpoint at the network layer so the
      # backend never ran. This RESOLVES every relative import against the
      # package tree instead of hoping something executes it.
      - name: relative imports resolve (incl. call-time)
        run: python scripts/check-relative-imports.py
      # ⭐⭐ EIGHT CORE ANCHORS NAME TWO SECTIONS EACH (§0.2), so a dispatch citing
      # "§8n" or "§4v.2" is ambiguous — §7j.6's collision class applied to the
      # addressing of the document that records it. The eight are frozen as a
      # DOWNWARD-ONLY baseline: a ninth fails, and an entry that stops colliding
      # must leave the list.
      - name: no new duplicate CORE anchors (§0.2)
        run: python scripts/check-ledger-anchors.py
      - name: route shadowing
        run: python scripts/check-route-shadowing.py
      # ⭐ A MODEL COLUMN WITHOUT A MIGRATION LINE TAKES EVERY READ OF THAT TABLE
      # DOWN, and the suite cannot see it: tests build SQLite from the models via
      # create_all(), so the test schema always has the column. 796 green tests
      # shipped a 500 on four anonymous demo surfaces. Needs two commits of
      # history — fetch-depth: 0 above.
      - name: model columns have migration lines
        run: python scripts/check-model-columns.py
      # ⭐ A FILTER THAT SILENTLY BECOMES NO FILTER. Three handlers independently
      # swallowed _norm_seniority's 422 and set the band to None — which means NO
      # FILTER, so an invalid band returned the FULL unsliced set on a k-floored
      # surface. Failing open returns more than was asked for and looks like an
      # answer.
      - name: sliced handlers fail closed
        run: python scripts/check-slice-filters.py
      # ⭐ THE BACKEND HALF OF THE PERIOD-LABEL CONTRACT, AND THE ONE THAT FAILS
      # OPEN. This script checks the emitter set FIRST and hard-fails before it
      # ever looks at the frontend, so it is fully meaningful here: a sixth
      # `period_labels` emitter appearing with no endpoint mapping breaks the
      # build. That is exactly the defect this lane fixed — labels emitted by the
      # backend that no frontend fetch ever publishes — and it originates in THIS
      # repo. The frontend scan inside it skips (see below); the cross-check does
      # not.
      # ⭐⭐ EXIT CODE FIXED 4 Aug (CORE §8v). This returned 1 whenever no
      # frontend checkout existed — regardless of the backend half passing — so
      # CI was red on main for three lanes and a REQUIRED STATUS CHECK was
      # impossible: requiring an always-red check blocks every push. It now
      # exits on the half it was asked to run, and NAMES the half that did not.
      # ⛔ AXIOM_FRONTEND_OPTIONAL is deliberately NOT set here. It downgraded
      # the whole check to a skip, which weakens a guard rather than fixing it.
      - name: period_labels emitter cross-check (backend half — enforced)
        run: python scripts/check-period-labels-published.py
      # ⭐ THE FOLLOWING GATE DOES NOT ENFORCE ANYTHING ON THIS RUNNER, AND SAYING
      # SO IS THE POINT. It reads the sibling `optimization-anchor` checkout via
      # AXIOM_FRONTEND, which does not exist in CI, so it skips. It was wired here
      # when it was written and has never checked a single file. It is kept
      # because it costs nothing and becomes real the moment a frontend checkout
      # is added — but a green tick on this step is NOT coverage, and the step
      # name has to carry that or the run reads as proof it isn't.
      # Real enforcement for the TS-side gates is the pre-push hook in the
      # frontend repo (.githooks/pre-push). See docs/reports/2026-07-29-two-outstanding.md.
      # ⭐ THE SKIP IS NOW EXPLICIT. These gates used to exit 0 with no frontend
      # checked out — green over zero files, which is the exact shape their own
      # coverage floors forbid. A missing frontend is now a FAILURE unless
      # AXIOM_FRONTEND_OPTIONAL=1 says otherwise, so "this step enforced nothing"
      # is a statement in the workflow rather than a silent tick.
      - name: TS-side period gates (SKIP ACKNOWLEDGED — no frontend checkout here)
        env:
          AXIOM_FRONTEND_OPTIONAL: "1"
        run: |
          python scripts/check-no-ts-period-format.py
          python scripts/check-period-labels-consumed.py
      # ⭐ SOLE OWNERSHIP OF NET DEBT / ROIC / WACC / EVA, BY ARITHMETIC SHAPE.
      # Written before the consolidation and RED on arrival — four net-debt
      # sites where there must be one. A guard added after the fix is
      # calibrated against a codebase that already passes and proves only that
      # it can print a tick.
      # A manifest nobody checks is a claim. Both directions: read-but-
      # undocumented, and documented-but-never-read.
      - name: env manifest matches the code
        run: python scripts/check-env-manifest.py
      - name: sole ownership (net debt, ROIC, WACC, EVA)
        run: python scripts/check-sole-owner.py
      # Complementary to the above, and neither is sufficient. check-sole-owner
      # types its operands (debt-ish minus cash) and so catches shapes this one
      # cannot; this one keys on pure arithmetic shape across the registry.
      # Reports coverage — 14 unambiguous of 53 derivable — before any duplicate,
      # and its zero is only readable against that 14.
      - name: registry ratio shapes (14 unambiguous of 53)
        run: python scripts/check-ratio-shapes.py
      # Class A. Margins are all `X / revenue * 100`, so no scan can tell them
      # apart — duplication is prevented by PLACE, not detected by shape. A
      # downward-only ratchet over the 5 modules that compute one today.
      - name: margin boundary (Class A)
        run: python scripts/check-margin-boundary.py
      # ⭐⭐ TWO FRONTIERS, ONE NOUN (CORE §7j.6). Six routes carry the word across
      # two engines — the capital-structure sweep and the strategic move search —
      # so a substring search cannot tell them apart and never will. A scope
      # report already made exactly that mistake and a ruling was withdrawn on
      # the false premise it produced. This asserts every frontier route has a
      # DECLARED owner, so a third one has to be added deliberately.
      - name: the two frontiers stay apart (§7j.6)
        run: python scripts/check-two-frontiers.py
      # ⭐⭐ Two optimisers gave opposite advice on leverage one tab apart and
      # NEITHER SAID WHAT IT MAXIMISED (§8m.1). They agreed on enterprise value
      # to within 0.07% — the contradiction was entirely in the objective, and
      # the objective was the one thing not on the page. A labelling convention
      # rots silently, so it is a gate: a new optimiser must declare its
      # objective, its prior, and the weight that prior puts on VALUE — the only
      # number that makes two different priors comparable.
      - name: every optimiser states its objective (§8m.1 A/B)
        run: python scripts/check-objective-labelled.py
      # ⭐⭐ FREQUENCY VIEWS (CORE §8o). Every registry token must declare whether
      # it SUMS or takes the CLOSING position — nothing infers it from a name, and
      # a prefix rule gets mk.dps, sa.arr and po.days_in_period wrong. Without the
      # declaration a coarsened balance sheet quadruples assets AND liabilities,
      # so it still balances and a reconciliation check cannot see it.
      # ⛔ It also asserts that pack, sentinel and watch never import the view
      # module: interpolation is read-time only, and §8a's reconciliation rests
      # on an interpolated figure never being frozen or fired on.
      - name: frequency views classified, interpolation cannot be frozen (§8o)
        run: python scripts/check-frequency-views.py
      # ⭐ WIRED 30 Jul AFTER IT WAS FOUND BLIND AND UNNOTICED. It exits 0 when
      # healthy and 2 when its own detection floor fails, so this step catches
      # the checker going blind — which is what happened: the sole-owner
      # consolidation moved invested_capital and wacc out of every dict literal
      # it scanned, the key set collapsed, and it correctly refused to report
      # while nothing ran it.
      - name: none-arithmetic detection floor
        run: python scripts/check-none-arithmetic.py
      # Prevention, not detection. The value-agreement survey found the
      # comparison set is ZERO — every policed quantity has one independent
      # implementation — so there is nothing to compare and a differential
      # harness would assert that a function agrees with itself. The real risk is
      # a SECOND implementation appearing unnoticed, which is how _debt_book
      # happened. Static, no corpus, ~1s.
      - name: route table (independent-route ratchet)
        run: python scripts/route-table.py
      # ⭐ A TOOLING FAILURE THAT KILLS A MEASUREMENT LANE IS A FALSE GREEN IN
      # REVERSE: the lane reports "undecidable" when the truth is "instrument
      # down". psycopg failed to import mid-lane in two consecutive lanes. This
      # runs the import + fallback audit only (no DB needed in CI) so a broken
      # or unpinned client is caught here rather than halfway through a
      # measurement.
      - name: db client preflight (import + fallback audit)
        run: python scripts/check-db-client.py
      # Sibling to the balance audit. Sweeps every stored dataset, not only
      # ingest — the eight affected datasets were written on 16 July and will
      # never re-ingest. Exits non-zero only when NO corpus is reachable, never
      # because a customer's assumption is unusual: it reports, it does not
      # refuse, and it does not repair.
      - name: assumption bounds sweep
        run: python scripts/check-assumption-bounds.py
      # section 7u coverage guard. Scans the CODE for constants reaching a
      # rendered figure and fails when one has no registry entry — a registry
      # listing forty constants and a guard confirming forty entries exist print
      # the same tick. Carries a known-positive control on every invocation.
      - name: assumption registry coverage
        run: python scripts/check-assumption-registry.py
      # §7s.1 — the freeze must capture every input a computation entry point
      # reads. Both sides derived from code: the read set from the sections' call
      # graphs, the captured set from pack.INPUT_CLASSES' own capture functions.
      # A guard proving only that a snapshot was taken is "0 problems in 0 files"
      # with a publication attached.
      - name: pack input coverage
        run: python scripts/check-pack-coverage.py
      # §7s.1 Stage 2 — the same correction from the opposite direction: the
      # export must carry every surface the app renders. Its section list was a
      # hand-maintained literal and went stale SILENTLY against everything that
      # shipped this year.
      - name: export coverage
        run: python scripts/check-export-coverage.py
      # ═══════════════════════════════════════════════════════════════════
      # ⭐⭐ THE TWELVE THAT WERE NEVER HERE — wired 4 Aug (CORE §8x).
      #
      # Measured at eb89ee8: 17 of 29 gates were in this file and TWELVE WERE
      # NOT — including check-no-internal-identifiers.py, written in the very
      # session that counted them. None of the twelve was absent because it
      # COULD NOT run: every one exits 0 on a runner with no database, no
      # frontend checkout and no corpus. ⭐ THEY WERE SIMPLY NEVER ADDED, and
      # "29/29 gates green" was a claim about one laptop for as long as that
      # was true. A test now derives the gate list from scripts/check-*.py and
      # fails if this file misses one, so the gap cannot silently reopen.
      # ═══════════════════════════════════════════════════════════════════
      # ── run in full here; nothing external needed ──────────────────────
      - name: no internal identifiers on a rendered key
        run: python scripts/check-no-internal-identifiers.py
      - name: no silent test-account counting
        run: python scripts/check-customer-counts.py
      - name: guard coupling (a write behind a guard)
        run: python scripts/check-guard-coupling.py
      - name: no seat caps, in either shape
        run: python scripts/check-no-seat-caps.py
      - name: pilot viewer is read-only
        run: python scripts/check-pilot-viewer-readonly.py
      - name: plain subscript ratchet
        run: python scripts/check-plain-subscript.py
      # ⭐ RUNS THE BACKEND HALF IN FULL. Its 16 green capability claims are
      # resolved against live symbols here; only the deep-link half needs the
      # frontend routeTree, and it NAMES that half as unverified rather than
      # counting it as a pass.
      - name: comparison matrix (capability half — enforced)
        run: python scripts/check-comparison-matrix.py
      # ⭐⭐ EXIT CODE FIXED 4 Aug. This returned 2 with no frontend checkout —
      # a failure on a condition it does not guard — which is why wiring it
      # before the fix would have made CI permanently red. It now runs the
      # capability half here, names the marking half as NOT RUN, and still
      # fails if the capability shipped while the exception stands.
      - name: in-development marking (capability half — enforced)
        run: python scripts/check-in-development-marking.py
      # ── structural control only; the live half needs a database or the app.
      # ⭐ THESE ARE NOT SKIPS. Each runs its own known-positive control in
      # full — planting the defect it exists to catch and requiring itself to
      # go red — and then STATES that the live rows were not consulted. The
      # control is the half that can run on a runner; a green here means the
      # detector works, NOT that production agrees with it.
      - name: single active dataset (control; live rows not consulted)
        run: python scripts/check-single-active-dataset.py
      - name: showcase dataset (control; live rows not consulted)
        run: python scripts/check-showcase-dataset.py
      - name: ownership agreement (control; live rows not consulted)
        run: python scripts/check-ownership-agreement.py
      - name: prospect routes (control; live app not fetched)
        run: python scripts/check-prospect-routes.py
      - run: pytest -q
      # Proves the tests guarding the assessment read path are not vacuous, by
      # reintroducing a plausible defect per test and requiring each to fail.
      # A test never observed failing is not evidence.
      - name: mutation check
        run: python scripts/mutation_check.py
