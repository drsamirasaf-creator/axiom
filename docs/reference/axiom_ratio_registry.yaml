# AXIOM RATIO REGISTRY
# Canonical source for §7r Ratio Analysis.
#
# ⭐ TOPIC OWNERSHIP — THIS FILE OWNS RATIO DEFINITIONS, FORMULAS AND VOCABULARY.
# Three documents describe AXIOM and each is authoritative on some topics and
# stale on others; the rule is by TOPIC, not by recency:
#     ratio definitions / formulas / vocabulary  -> THIS FILE
#     pricing and commercial terms               -> docs/brochure/AXIOM_Capabilities_Brochure_v2.html
#     rulings, segments, open items              -> docs/ledger/AXIOM_LEDGER_CORE.md
# LEDGER_AMENDMENT_2026-07-31.md is a DATED AMENDMENT, not a fourth owner. It
# describes this registry at 7r.2; the registry is at 7r.7. Read it for what it
# ruled, never for current state.
#
# STATUS: draft for founder review. Nothing here is locked until it is in
# AXIOM_MASTER_LEDGER as §7r-R.
#
# PURPOSE: single machine-readable owner of every ratio AXIOM computes.
# Code DERIVES from this file. Claude Code must not hand-write formulas in
# engines.py that also appear here — that is the two-owners shape that has
# already produced three trio-class defects.
#
# CONSUMERS (all read, none redefine):
#   - §7r Ratio Analysis tab
#   - optimization_status  (roic, wacc — was reading cur["roic"] directly)
#   - §7n EVA             (engines.py:524)
#   - valuation surface   (wacc, net_debt)
#   - §7i viability kernel (state indicators only, not published scores)
#
# OPEN ITEM FOR CLAUDE CODE: every token in `vocabulary` below is a PLACEHOLDER
# name. First build task is to reconcile these against the actual v8 template
# row identifiers and the ingest canonical schema, then rewrite the token list
# in place. Do not proceed to formula evaluation until the vocabulary is real.

schema_version: 1
registry_version: "7r.11"  # 2 Aug stage 3: R6 — template v10 working-capital split   # Segment B: debt-as-argument   # founder rulings 31 Jul; headline set = 14
# 7r.5 — CHAINING RULE RELOCATED, NOT RELAXED. Founder ruling. The
#   no-ratio-of-ratios prohibition applied to everything and was written in
#   evaluation.forbidden; it now lives in client_extension.no_ratio_of_ratios,
#   where it was always meant to apply. Canonical chaining is PERMITTED and
#   documented in evaluation.canonical_chaining. Ten formulas that carried an
#   `exception_to_no_ratio_refs` marker no longer need one — the markers are
#   removed as unnecessary, and NO FORMULA WAS REWRITTEN.
#
# 7r.4 — SPECIFICATION CORRECTION, NOT A BEHAVIOUR CHANGE. Founder ruling.
#   axiom.invested_capital now includes bs.preferred. Segment E measured BOTH
#   implementations and found preferred equity already present in each: the code
#   was right and the spec was wrong. Preferred is capital the business deploys,
#   so omitting it makes ROIC OVERSTATE returns for any company holding any.
#   No code change, no diff owed.
#
#   ⭐ WHY THIS WAS NOT VISIBLE: the correction was made in an advisory session
#   against a copy outside the repository, and the bundle committed at 26cc7f8
#   was assembled before that edit. So the file said 7r.3 and omitted preferred
#   while the ruling and the code both had it. A specification that is not in the
#   repository is a claim — and this is the third time in one day that a claim
#   about a file was not supported by the file.
canonical_units: millions   # matches post-ingest normalisation
period_support: [annual, quarterly, monthly]
# ⭐ MONTHLY ADDED 6 Aug. The engines have supported it since d8e31a5 (three-way
# equivalence proven); this file still said [annual, quarterly], so the registry
# and the engines disagreed about which grains exist. Semi-annual is DROPPED by
# ruling — it exists in neither PERIODS_PER_YEAR nor periods.py, and it is a real
# build for a frequency almost nobody reports on.
#
# ⭐⭐ EVERY VOCABULARY TOKEN NOW DECLARES `aggregation` (ruling 3, 6 Aug).
# §7r-R R4 reasoned about stock-versus-flow for RATIOS and never encoded it for
# LINES, so nothing in the codebase knew a balance sheet is not a flow — a
# coarsener would have tripled assets, and a linear interpolator would have
# smeared a closing balance across three months.
#
#   sum            a flow; sub-period values ADD
#   closing        a stock; the coarser period takes the LAST sub-period
#   derived        never aggregated itself — recomputed from aggregated inputs
#   constant       a rate or policy, identical at every grain
#   period_defined a property of the period, recomputed for the target grain
#
# ⛔ DECLARED, NEVER INFERRED FROM THE NAME. A prefix rule gets `mk.dps` wrong
# (dividends per share is a flow sitting among point-in-time tokens), gets
# `sa.arr` and `sa.mrr` wrong (RUN RATES, not flows — summing twelve MRRs to make
# an ARR is the error this field exists to prevent), and has nothing to say about
# `po.days_in_period`, which is a property of the period rather than of the
# company.

# ---------------------------------------------------------------------------
# EVALUATION CONTRACT
# ---------------------------------------------------------------------------
evaluation:
  parser: safe_ast          # tokenise -> AST -> evaluate. eval() is forbidden.
  operators: ["+", "-", "*", "/", "(", ")"]
  functions:
    avg:    "avg(x)          mean of opening and closing balance for the period"
    prior:  "prior(x)        same line item, immediately preceding period"
    abs:    "abs(x)"
    min:    "min(x, y, ...)"
    max:    "max(x, y, ...)"
  # ⭐⭐ R2 (FOUNDER RULING, 2 Aug) — DELEGATION IS THE PATTERN. These are NOT
  # arithmetic the evaluator performs. They are calls into the code that already
  # owns the quantity, and they are declared here so that a formula naming one
  # is a deliberate delegation rather than an undeclared token.
  #
  # Both were in use and neither was declared, so the registry called functions
  # its own `forbidden` list prohibited. axiom.wacc has ALWAYS been written this
  # way — the registry solved sole ownership for the hardest of its five
  # duplicated quantities by calling the owner, and never wrote down that it had.
  engine_functions:
    wacc_at:
      signature: "wacc_at(leverage) -> percent"
      owner: "services/api/modules/financials/ratios.py::wacc_at"
      why: "WACC has one owner (§7r-O). A registry formula restating the blend
        would be a second implementation of the quantity this registry itself
        declares single-owner. Used by axiom.wacc."
      argument: "actual_leverage — see policy_and_assumptions."
    # ⭐⭐ R7 (2 Aug) — THE FIVE THAT USED TO RESTATE. Each was arithmetic
    # written out in this file for a quantity the codebase declares
    # single-owner; each is now a CALL. They are declared here for the same
    # reason wacc_at is: a formula naming one is a deliberate delegation, and
    # `forbidden` prohibits any identifier this file does not declare.
    net_debt:
      signature: "net_debt(debt, cash) -> currency"
      owner: "services/api/modules/financials/ratios.py::net_debt"
      why: "§7r-O. Four hand-written copies agreed on every stored dataset and
        THREE OF THE FOUR RAISED where the fourth propagated absence — they were
        never equivalent, only untested on the path that differed."
    total_debt:
      signature: "total_debt(short_term_debt, long_term_debt) -> currency"
      owner: "services/api/modules/financials/ratios.py::total_debt"
      why: "Total debt is COUNTED rather than consolidated — 17 callers may
        legitimately form the term. What may not happen is the SPECIFICATION
        restating it: that is not a caller forming a term, it is an eighteenth
        implementation in a file the sole-owner guard reads as code."
    invested_capital:
      signature: "invested_capital(debt, equity, preferred, minority, cash) -> currency"
      owner: "services/api/modules/financials/ratios.py::invested_capital"
      why: "ROIC's denominator. Sole ownership of ROIC is hollow while its
        denominator has copies."
    roic:
      signature: "roic(nopat, invested_capital) -> fraction"
      owner: "services/api/modules/financials/ratios.py::roic"
      absence: "A ZERO invested capital yields absence, not 0% and not a
        division error. The guard is part of the definition and moved with it."
      note: "NOPAT is passed in. It is not a guarded quantity and has no owner,
        so the formula forms it inline; what had to delegate is the DIVISION."
    eva:
      signature: "eva(nopat, wacc, invested_capital) -> currency"
      owner: "services/api/modules/financials/ratios.py::eva"
      note: "⭐ WACC IS AN ARGUMENT, NOT A LOOKUP. The original closed over the
        caller's wacc dict; a library function reaching for it would silently
        un-shock any caller that scaled its cost of capital."
    cagr:
      signature: "cagr(line) -> percent"
      owner: "services/api/modules/financials/engines.py::_cagr"
      # ⭐⭐ THE HORIZON IS A RULE, NOT A CONSTANT — AND IT HAD TO BE MEASURED
      # BEFORE IT COULD BE DECLARED. `axiom.revenue_cagr` was `cagr(is.revenue)`
      # with no horizon anywhere in the registry, which made it ambiguous as
      # written: a CAGR without a window is not a number.
      #
      # The engine does state one, consistently, at all three call sites
      # (engines.py:880, engines.py:687, forecast_studio.py:133): the FULL
      # HISTORICAL WINDOW, endpoint to endpoint, with exponent n = hist_n - 1.
      # It is window-relative rather than a fixed number of years — measured
      # across the 33 stored datasets, hist_n runs 2, 3, 5, 6 and 12, so n runs
      # 1 to 11. A registry declaring "5-year CAGR" would be wrong on 17 of 33.
      horizon: "full historical window, endpoint to endpoint; exponent
        n = (count of historical periods) - 1. Forecast periods are EXCLUDED —
        the KPI strip labels this 'Revenue CAGR (hist)'."
      absence: "n <= 0, or either endpoint <= 0, yields 0.0 at engines.py:615.
        ⭐ RECORDED AS AN OPEN DISAGREEMENT WITH THE ABSENCE RULE, NOT RESOLVED
        HERE: a zero returned for 'cannot be computed' is the `or 0` shape this
        codebase removes everywhere else. Changing it would move a rendered
        figure, which this lane forbids. Routed, not fixed."
      distinct_from: "proforma.py:224's plan_cagr, which runs over the FORECAST
        window (fyears) and is a different quantity with the same name."
  forbidden:
    - free-text formula entry
    - literal numbers other than 1, 2, 100, 365, 366, 12, 4
    - any token not present in `vocabulary`
    # ⭐ `functions` and `engine_functions` both satisfy this. The rule was
    # written when the only callables were the five above; it was silently
    # false for wacc_at and cagr from the day each was first used.
    # NOTE: "no ratio-of-ratios" lived here and applied to everything. It now
    # lives under client_extension.no_ratio_of_ratios, because it was never a
    # statement about arithmetic — see canonical_chaining below.

  canonical_chaining:
    rule: "PERMITTED for axiom.* ratios. A canonical formula MAY reference
      another canonical ratio's output."
    ruling: "FOUNDER RULING, 7r.5. The earlier blanket prohibition collapsed two
      different risks into one sentence. An arbitrary CLIENT chain is unbounded
      and unauditable — anyone may compose anything, to any depth, and provenance
      genuinely becomes unresolvable. A CANONICAL chain is a fixed, hand-audited
      graph of 77 formulas in one reviewed file. Same syntax, different risk."
    ⭐_why_not_inlined: "Inlining the ten chained formulas would recreate exactly
      the duplication five segments were spent removing. `axiom.roic` referencing
      `axiom.invested_capital` IS what single ownership means: one definition of
      the capital base, called from everywhere it is needed. Expanding it back
      into roic's formula would put a second copy of that arithmetic in the file
      that exists to prevent second copies."
    ⭐_scan_contract: "The shape scan keys ON the chain, not THROUGH it.
      `invested_capital` inside `roic` is a CALL, not an expansion. A second ROIC
      that computes its own denominator inline is precisely the duplicate the
      scan must catch — and inlining first would make it invisible, because the
      inlined canonical form and the duplicate would then have the same shape."
    depth: "Unbounded within axiom.*, because the graph is fixed and reviewable.
      axiom.eva -> axiom.roic -> axiom.invested_capital is three levels and is
      correct."
    provenance: "The §7n-A explainer walks the chain and reports each step's
      numerator and denominator, so a chained ratio is MORE traceable than an
      inlined one, not less."

  absence:
    rule: "Absence propagates. Never coerced to zero."
    missing_input: em_dash
    zero_denominator: em_dash
    negative_under_sqrt: em_dash
    display_on_absence: "— (requires: <list of missing tokens>)"

  averaging:
    rule: "FOUNDER RULING, 31 Jul. Every ratio with basis: average requires
      (opening + closing)/2, which needs the v8 Opening column. NO STORED
      DATASET HAS ONE — v8 shipped 30 Jul and nobody has re-uploaded. So on
      day one every period on every company falls back to opening balances."
    fallback: beginning_of_period
    rejected_alternative: "Closing balances. Printing a closing-balance number
      under an avg() formula is fabrication in the same class as the coerced
      ROIC — a number rendered under a formula it did not use."
    why_bop_not_neutral: "BOP inflates returns relative to true average for a
      growing company, directionally. It is defensible on its own terms — a
      flow measured against the capital actually held at the start — but it is
      not a like-for-like substitution and the banner must say so."
    display:
      explainer: "The explainer shows the formula ACTUALLY USED. Under
        fallback it reads 'PAT / Opening Total Assets', never
        'PAT / avg(Total Assets)' with a footnote. The displayed formula is
        the formula used."
      banner: "ONE dataset-scoped banner, not thirteen per-ratio labels:
        'Average-balance ratios computed on opening balances; re-upload on
        template v9 to enable period averaging.'"
      self_extinguish: "The banner disappears the moment the dataset carries
        an Opening column. Furniture with an expiry, not permanent furniture."
    first_period:
      rule: "The earliest period has no prior close, therefore no BOP. It is
        an em dash, handled by the not-available list — NOT by the banner.
        'Every period falls back to BOP' cannot be true for period one."

  anchoring:
    rule: "§7p applies. Last actual period distinctly marked; historical and
           forecast visually separated. A ratio computed from forecast inputs
           is labelled forecast."

  explainer:
    rule: "§7n-A applies. Every ratio, canonical or client, must return:
           definition, formula (human-readable), this period's numerator and
           denominator as numbers, source statement lines, period basis, and
           provenance."

# ---------------------------------------------------------------------------
# TOKEN VOCABULARY — RECONCILED AGAINST THE BACKEND, 7r.6
# ---------------------------------------------------------------------------
# ⭐ THIS BLOCK WAS PLACEHOLDER NAMES. It is now reconciled against the real
# canonical schema (engines.IS_KEYS / BS_KEYS / CF_KEYS, COMPANY_FIELDS).
# There is NO translation layer: the mapping lives here and nowhere else,
# because a second copy of it would be a second owner.
#
# source: stored   backed by a real field. `field:` names it EXACTLY.
# source: derived  computed from other tokens. `expr:` is the arithmetic;
#                  `at:` cites the implementation where one exists.
#                  ⭐ A DERIVED TOKEN CHANGES THE SHAPE THE SCAN SEEKS —
#                  bs.total_debt is not a column, it is an addition.
# collected:false  no backing field and no derivation. `requires:` says what
#                  would have to exist.
#
# ⭐ FOUR TOKENS WERE MARKED collected: true AND ARE NOT COLLECTED —
# bs.payables, bs.retained_earnings, cf.operating_cash_flow, and the
# is.depreciation / is.amortisation pair (one combined field). Every one was
# a claim the schema did not support. cf.operating_cash_flow blocks a
# HEADLINE ratio (axiom.cash_conversion_quality).
vocabulary:

  income_statement:
    is.revenue:
      source: stored
      aggregation: sum
      collected: true
      field: revenue
    is.cogs:
      source: stored
      aggregation: sum
      collected: true
      field: cogs
    is.gross_profit:
      source: derived
      aggregation: derived
      collected: true
      expr: "is.revenue - is.cogs"
    is.operating_expenses:
      source: stored
      aggregation: sum
      collected: true
      field: opex
    is.sga:
      source: absent
      aggregation: sum
      collected: false
      requires: "SG&A is not split out; opex is a single line"
    is.dep_amort:
      source: stored
      aggregation: sum
      collected: true
      field: depreciation_amortization
      note: "FOUNDER RULING 7r.7 — collapsed from is.depreciation + is.amortisation. The template collects ONE combined line, so two tokens over one field was a spec asking for something the system cannot produce. Same shape as a department name the canonical list cannot make. Split again if a template ever collects them separately."
    is.ebitda:
      source: derived
      aggregation: derived
      collected: true
      expr: "is.revenue - is.cogs - is.operating_expenses"
    is.ebit:
      source: derived
      aggregation: derived
      collected: true
      expr: "is.ebitda - is.dep_amort"
      at: "engines.py:280"
      # ⭐⭐ DEFECT 1, FIXED 2 Aug. This read `is.ebitda -
      # depreciation_amortization` — the STORAGE FIELD NAME of is.dep_amort,
      # not the token. Fallout from FOUNDER RULING 7r.7, which collapsed
      # is.depreciation + is.amortisation into is.dep_amort: the vocabulary key
      # was renamed and this expression was not.
      #
      # `evaluation.forbidden` already prohibits "any token not present in
      # vocabulary", so the registry violated its own evaluation contract at
      # its most-used token. NOT A RULING — one correct answer: EBITDA less D&A
      # is EBIT, and is.dep_amort is the only D&A token the vocabulary has.
      #
      # It blocked 29 downstream ratios, six of them headline. A rename that
      # misses one site is invisible until something tries to resolve it, and
      # nothing did for five registry versions.
    is.interest_expense:
      source: stored
      aggregation: sum
      collected: true
      field: interest_expense
    is.interest_income:
      source: absent
      aggregation: sum
      collected: false
      requires: "not collected and not derived; net interest is not split"
    is.pbt:
      source: derived
      aggregation: derived
      collected: true
      expr: "is.ebit - is.interest_expense"
      at: "engines.py:281"
    is.tax_expense:
      source: derived
      aggregation: derived
      collected: true
      expr: "po.tax_rate_policy * max(is.pbt, 0)"
      at: "engines.py:282"
    is.pat:
      source: derived
      aggregation: derived
      collected: true
      expr: "is.pbt - is.tax_expense"
      at: "engines.py:283"
    is.rd_expense:
      source: absent
      aggregation: sum
      collected: false
      requires: "R&D line"
    is.bad_debt_expense:
      source: absent
      aggregation: sum
      collected: false
      requires: "bad debt / allowance lines"
    is.purchases:
      source: absent
      aggregation: sum
      collected: false
      requires: "purchases as distinct from COGS"
    is.lease_expense:
      source: absent
      aggregation: sum
      collected: false
      requires: "lease expense line"

  balance_sheet:
    bs.cash:
      source: stored
      aggregation: closing
      collected: true
      field: cash
    bs.receivables:
      source: stored
      aggregation: closing
      collected: true
      field: receivables
      optional: true
      component_of: bs.other_current_assets
      # ⭐⭐ R6 (2 Aug) — COLLECTED FROM TEMPLATE v10. It is a COMPONENT of its
      # aggregate, not a re-partition of it: other_current_assets stays exactly as
      # entered and remains the source of truth for every total. Deriving the
      # aggregate from the parts would have silently dropped everything else
      # living in it.
      #
      # ⭐ OPTIONAL, AND ABSENT ON EVERY DATASET UPLOADED BEFORE v10. A ratio
      # needing it renders ABSENCE, stated per ratio — never zero, and never
      # inferred from the unsplit total. A cash conversion cycle computed from
      # a guessed receivables figure is fabrication.

    bs.inventory:
      source: stored
      aggregation: closing
      collected: true
      field: inventory
      optional: true
      component_of: bs.other_current_assets
      # ⭐⭐ R6 (2 Aug) — COLLECTED FROM TEMPLATE v10. It is a COMPONENT of its
      # aggregate, not a re-partition of it: other_current_assets stays exactly as
      # entered and remains the source of truth for every total. Deriving the
      # aggregate from the parts would have silently dropped everything else
      # living in it.
      #
      # ⭐ OPTIONAL, AND ABSENT ON EVERY DATASET UPLOADED BEFORE v10. A ratio
      # needing it renders ABSENCE, stated per ratio — never zero, and never
      # inferred from the unsplit total. A cash conversion cycle computed from
      # a guessed receivables figure is fabrication.

    bs.other_current_assets:
      source: stored
      aggregation: closing
      collected: true
      field: other_current_assets
    bs.current_assets:
      source: derived
      aggregation: derived
      collected: true
      expr: "bs.cash + bs.other_current_assets"
    bs.ppe_net:
      source: stored
      aggregation: closing
      collected: true
      field: property_plant_equipment_net
    bs.intangibles:
      source: stored
      aggregation: closing
      collected: true
      field: intangible_assets_net
      note: "goodwill is a SEPARATE stored field and is not included here"
    # ⭐⭐ DEFECT 2, FIXED 2 Aug. `bs.total_assets` referenced a bare
    # `noncurrent_assets` that was in no namespace and no vocabulary — so the
    # registry's own total assets was unresolvable, and with it ROA.
    #
    # NOT A RULING: the field is collected. `templates.py:411` derives it from
    # five components with absence propagating, and `derive_series` reads
    # BS["noncurrent_assets"] on every dataset. The token was simply never
    # declared. Basis and absence semantics are copied from that site rather
    # than restated, because a second description of one rule is how the two
    # drift apart.
    bs.noncurrent_assets:
      source: stored
      aggregation: closing
      collected: true
      field: noncurrent_assets
      # ⭐ STORED, NOT DERIVED — and the first draft of this entry got it wrong
      # in the way this whole lane is about. Writing it as `expr: bs.ppe_net +
      # bs.goodwill + bs.intangibles + bs.long_term_investments +
      # bs.other_noncurrent_assets` would have introduced THREE new undeclared
      # tokens while fixing a defect whose whole content is an undeclared token.
      #
      # The line is a required field of the data model. v8 ALSO derives it at
      # INGEST from five optional components (templates.py:411) when they are
      # supplied, with absence propagating — if any component is absent the
      # total is absent, because a partial sum presented as a total is a
      # fabricated balance sheet. A pre-v8 workbook supplies no components and
      # its own entered total stands unchanged. That is an ingest rule, not a
      # ratio-evaluation rule, and it stays owned where it is written.
      at: "templates.py:411 (ingest-time derivation), engines.py:487 (read)"
    bs.total_assets:
      source: derived
      aggregation: derived
      collected: true
      expr: "bs.current_assets + bs.noncurrent_assets"
    bs.payables:
      source: stored
      aggregation: closing
      collected: true
      field: payables
      optional: true
      component_of: bs.other_current_liabilities
      # ⭐⭐ R6 (2 Aug) — COLLECTED FROM TEMPLATE v10. It is a COMPONENT of its
      # aggregate, not a re-partition of it: current_liabilities_ex_debt stays exactly as
      # entered and remains the source of truth for every total. Deriving the
      # aggregate from the parts would have silently dropped everything else
      # living in it.
      #
      # ⭐ OPTIONAL, AND ABSENT ON EVERY DATASET UPLOADED BEFORE v10. A ratio
      # needing it renders ABSENCE, stated per ratio — never zero, and never
      # inferred from the unsplit total. A cash conversion cycle computed from
      # a guessed receivables figure is fabrication.
    bs.short_term_debt:
      source: stored
      aggregation: closing
      collected: true
      field: short_term_debt
    bs.other_current_liabilities:
      source: stored
      aggregation: closing
      collected: true
      field: current_liabilities_ex_debt
      note: "the stored field is the whole ex-debt aggregate, not an 'other' residual"
    bs.current_liabilities:
      source: derived
      aggregation: derived
      collected: true
      expr: "bs.other_current_liabilities + bs.short_term_debt"
    bs.long_term_debt:
      source: stored
      aggregation: closing
      collected: true
      field: long_term_debt
    # ⭐⭐ DEFECT 3, FIXED 2 Aug. Same shape as bs.noncurrent_assets: the token
    # was referenced bare by bs.total_liabilities and never declared. It IS
    # collected — templates.py:67 carries it as "Other Non-Current Liabilities"
    # — and it is one of the v8 OPTIONAL keys (engines.py:62), so absence is a
    # legitimate state on a pre-v8 dataset rather than a validation failure.
    bs.other_noncurrent_liabilities:
      source: stored
      aggregation: closing
      collected: true
      field: other_noncurrent_liabilities
      optional: true
      at: "engines.py:62 (BS_OPTIONAL_KEYS)"
    # ⭐⭐ R1 (FOUNDER RULING, 2 Aug) — OPERATING WORKING CAPITAL, EX-CASH AND
    # EX-DEBT. This token was referenced by cf.operating_cash_flow and declared
    # nowhere, and declaring it was never clerical: there were two candidates
    # differing on TWO terms, both standard, and they are different quantities.
    #
    #   axiom.working_capital   bs.current_assets - bs.current_liabilities
    #                           -> INCLUDES cash, INCLUDES short-term debt
    #   bs.nwc (this token)     bs.other_current_assets
    #                             - bs.other_current_liabilities
    #                           -> excludes both. The engine's basis,
    #                              engines.py:455.
    #
    # RULED: a cash-flow bridge that includes cash DOUBLE-COUNTS IT. Operating
    # NWC excludes cash and debt for exactly that reason. axiom.working_capital
    # is untouched and remains the separate all-current measure — two names for
    # two quantities, rather than one name quietly meaning either.
    #
    # ⭐ THE STORED FIELD BEHIND bs.other_current_liabilities IS THE WHOLE
    # EX-DEBT AGGREGATE (`current_liabilities_ex_debt`), not an "other"
    # residual — see its own note. So this expression is the engine's
    # `other_current_assets - current_liabilities_ex_debt` token for token, not
    # an approximation of it.
    bs.nwc:
      source: derived
      aggregation: derived
      collected: true
      expr: "bs.other_current_assets - bs.other_current_liabilities"
      at: "engines.py:455"
      basis: operating
      distinct_from: "axiom.working_capital — see above. Not interchangeable."
    bs.total_liabilities:
      source: derived
      aggregation: derived
      collected: true
      expr: "bs.current_liabilities + bs.long_term_debt + bs.other_noncurrent_liabilities"
    bs.equity:
      source: stored
      aggregation: closing
      collected: true
      field: total_equity
    bs.minority_interest:
      source: stored
      aggregation: closing
      collected: true
      field: minority_interest
    bs.preferred:
      source: stored
      aggregation: closing
      collected: true
      field: preferred_equity
      note: "added 7r.4"
    bs.total_debt:
      source: derived
      aggregation: derived
      collected: true
      # R2/R7: DELEGATES. Restating the sum here would be an eighteenth
      # implementation, in a file the sole-owner guard reads as code.
      expr: "total_debt(bs.short_term_debt, bs.long_term_debt)"
      at: "⭐ DERIVED, NOT STORED. A token resolving to an EXPRESSION changes the arithmetic shape the scan must look for."
    bs.secured_debt:
      source: absent
      aggregation: closing
      collected: false
      requires: "debt composition — secured/unsecured"
    bs.floating_rate_debt:
      source: absent
      aggregation: closing
      collected: false
      requires: "debt composition — fixed/floating"
    bs.allowance_doubtful:
      source: absent
      aggregation: closing
      collected: false
      requires: "allowance line"
    bs.retained_earnings:
      source: absent
      aggregation: closing
      collected: false
      requires: "a retained earnings line. TEMPLATE QUESTION, not a registry one — joins the v9 pile alongside the other_current_assets split (bs.receivables, bs.inventory). Was marked collected: true and is not collected."

  cash_flow:
    cf.operating_cash_flow:
      source: derived
      aggregation: derived
      collected: true
      # R1: `nwc` was a bare undeclared name. Now bs.nwc — the OPERATING basis.
      expr: "is.pat + is.dep_amort - (bs.nwc - prior(bs.nwc))"
      at: "ratios.py::operating_cash_flow — extracted from proforma.py:147, which already computed this arithmetic for FORECAST years only and without absence propagation. The registry said 'no owner'; there was one, for half the periods."
    cf.capex:
      source: stored
      aggregation: sum
      collected: true
      field: capex
    cf.maintenance_capex:
      source: absent
      aggregation: sum
      collected: false
      requires: "maintenance vs growth capex split"
    cf.growth_capex:
      source: absent
      aggregation: sum
      collected: false
      requires: "maintenance vs growth capex split"
    cf.investing_cash_flow:
      source: absent
      aggregation: sum
      collected: false
      requires: "not collected"
    cf.financing_cash_flow:
      source: absent
      aggregation: sum
      collected: false
      requires: "not collected"
    cf.dividends_paid:
      source: stored
      aggregation: sum
      collected: true
      field: dividends
    cf.debt_raised:
      source: absent
      aggregation: sum
      collected: false
      requires: "⭐ only NET borrowing is stored (net_borrowing). Gross raised/repaid cannot be recovered from a net figure."
    cf.debt_repaid:
      source: absent
      aggregation: sum
      collected: false
      requires: "⭐ see cf.debt_raised — net_borrowing only."
    cf.cash_from_customers:
      source: absent
      aggregation: sum
      collected: false
      requires: "not collected"
    cf.buybacks:
      source: absent
      aggregation: sum
      collected: false
      requires: "not collected"

  market_and_shares:
    mk.shares_outstanding:
      source: stored
      aggregation: closing
      collected: true
      field: company.shares_outstanding
      note: "company-level field, not a statement line"
    mk.share_price:
      source: stored
      aggregation: closing
      collected: true
      field: company.share_price
      note: "company-level; public companies only"
    mk.market_cap:
      source: derived
      aggregation: derived
      collected: true
      expr: "mk.share_price * mk.shares_outstanding"
    mk.dps:
      source: absent
      aggregation: sum
      collected: false
      requires: "dividend per share not collected"

  policy_and_assumptions:
    po.tax_rate_policy:
      source: stored
      aggregation: constant
      collected: true
      field: company.tax_rate
      note: "company-level policy input"
    po.cost_of_equity:
      source: derived
      aggregation: constant
      collected: true
      expr: "CAPM: risk_free_rate + beta * market_risk_premium + premia"
      at: "ratios.py::cost_of_equity_at"
    po.cost_of_debt:
      source: stored
      aggregation: constant
      collected: true
      field: company.cost_of_debt
    po.days_in_period:
      source: derived
      aggregation: period_defined
      collected: true
      expr: "365 | 366 | 90 by period basis"
      at: "a convention, not an input"
    # ⭐⭐ R2 — wacc_at's ARGUMENT, declared so axiom.wacc resolves. It was a
    # bare `actual_leverage` in that formula and in no namespace.
    #
    # ⭐ IT IS MODE-DEPENDENT, AND FLATTENING THAT WOULD BE THE DEFECT. There is
    # no single expression for it (engines.py:566, :579):
    #
    #   public   D/E = _debt_book / market equity value
    #            — a MARKET-derived ratio; the caller must supply the debt basis
    #              (see ratios.net_debt) and a default of 0.0 once priced a
    #              company as debt-free
    #   private  D/E = company.target_debt_to_equity
    #            — a POLICY input, not an observation
    #
    # Declaring it `derived` with one expr would assert an identity the code
    # does not have. It is what the caller resolves and hands to wacc_at.
    po.actual_leverage:
      source: caller_resolved
      aggregation: derived
      collected: true
      at: "engines.py:566 (public), engines.py:579 (private)"
      note: "D/E at the company's actual capital structure. Public: market
        equity vs book debt. Private: the target D/E policy input. Passed to
        wacc_at; never re-derived inside a formula."

  human_capital:
    hc.headcount:
      source: absent
      aggregation: closing
      collected: false
      requires: "headcount not collected"
    hc.payroll_cost:
      source: absent
      aggregation: sum
      collected: false
      requires: "payroll cost not collected"

  saas:
    sa.arr:
      source: absent
      aggregation: closing
      collected: false
      requires: "SaaS metrics not collected"
    sa.mrr:
      source: absent
      aggregation: closing
      collected: false
      requires: "SaaS metrics not collected"
    sa.gross_churn:
      source: absent
      aggregation: derived
      collected: false
      requires: "SaaS metrics not collected"
    sa.nrr:
      source: absent
      aggregation: derived
      collected: false
      requires: "SaaS metrics not collected"
    sa.cac:
      source: absent
      aggregation: derived
      collected: false
      requires: "SaaS metrics not collected"
    sa.customers:
      source: absent
      aggregation: closing
      collected: false
      requires: "SaaS metrics not collected"

# ---------------------------------------------------------------------------
# CANONICAL RATIOS
# ---------------------------------------------------------------------------
# Fields:
#   id            stable, namespaced, immutable once locked
#   tier          core | advanced | industry
#   unit          percent | times | days | currency | ratio
#   polarity      higher_better | lower_better | band | context
#   basis         point_in_time | average   (average => needs v8 Opening column)
#   single_owner  true => this registry is the ONLY computation; see CONSUMERS
#   headline      true => appears in the v1 executive dashboard
#
# v1 SCOPE = every row with `headline: true`. Everything else is the staged
# library. User never sees more than ~20 rows on one screen.
#
# HEADLINE SET — 14, LOCKED 31 Jul:
#   margins   gross, EBITDA, operating (EBIT), net
#   returns   ROIC, ROE, ROA
#   leverage  net debt/EBITDA, debt/equity, interest coverage
#   liquidity current ratio
#   cash      FCF conversion
#   value     ROIC - WACC spread
#   growth    revenue growth (YoY)
# FOURTEENTH ADDED 31 Jul. Revenue growth is the ratio whose absence started
# §7r — "the app can't tell you your revenue growth rate." Shipping the
# executive dashboard without the question that created it is the wrong shape.
# ONE growth row only: EBITDA and PAT growth stay in the library. Three growth
# rows on a 14-row dashboard would make it a growth page.
#   "FCF conversion" = axiom.cash_conversion_quality (OCF/EBITDA), NOT FCFF.
# EVA and WACC are OWNED by the library but are NOT headline ratios — EVA is a
# currency figure, WACC a rate. They are exposed so the spread cannot drift
# from its own terms.

ratios:

  # --- 1. PROFITABILITY -----------------------------------------------------
  - id: axiom.gross_margin
    name: Gross Margin
    category: Profitability
    tier: core
    headline: true
    formula: "is.gross_profit / is.revenue * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Gross profit as a percentage of revenue. Measures production
      or delivery efficiency before overhead."

  - id: axiom.ebitda_margin
    name: EBITDA Margin
    category: Profitability
    tier: core
    headline: true
    formula: "is.ebitda / is.revenue * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "EBITDA as a percentage of revenue. Cash operating
      profitability before capital structure and depreciation policy."

  - id: axiom.operating_margin
    name: Operating Margin
    category: Profitability
    tier: core
    headline: true
    formula: "is.ebit / is.revenue * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "EBIT as a percentage of revenue. Core operating
      profitability after all operating costs."

  - id: axiom.pbt_margin
    name: PBT Margin
    category: Profitability
    tier: core
    headline: false
    formula: "is.pbt / is.revenue * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Profit before tax as a percentage of revenue."

  - id: axiom.net_margin
    name: Net Margin
    category: Profitability
    tier: core
    headline: true
    formula: "is.pat / is.revenue * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Profit after tax as a percentage of revenue."

  - id: axiom.effective_tax_rate
    name: Effective Tax Rate
    category: Profitability
    tier: core
    headline: false
    formula: "is.tax_expense / is.pbt * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    definition: "Tax expense as a percentage of profit before tax. Compare
      against the statutory rate in po.tax_rate_policy."

  # --- 2. RETURNS -----------------------------------------------------------
  - id: axiom.roa
    name: Return on Assets
    category: Returns
    tier: core
    headline: true
    # ⭐⭐ R4 (FOUNDER RULING, 2 Aug) — POINT-IN-TIME, NOT AVERAGE.
    # This carried `basis: average` and an avg() while the engine has always
    # computed point-in-time. Measured over 291 consecutive period pairs on the
    # live corpus: median gap 0.46 pp, MAXIMUM 313.54 pp, and 79 pairs (27%)
    # differing by more than a full percentage point. ROIC drives the
    # "value-creating / value-eroding" sentence, so a gap that size crosses the
    # verdict.
    #
    # RULED: the ENGINE is authoritative. avg() and the basis field are removed
    # rather than the engine changed — the specification was wrong, and no
    # rendered figure moves.
    #
    # ⭐ AND THE FIRST PERIOD RENDERS ABSENCE, NEVER THE CLOSING BALANCE. A
    # single-balance "average" is not an average; substituting the closing
    # balance would have made period one silently disagree with every other
    # period under a label claiming they were computed alike.
    formula: "is.pat / bs.total_assets * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Profit after tax over average total assets."

  - id: axiom.roe
    name: Return on Equity
    category: Returns
    tier: core
    headline: true
    # ⭐⭐ R4 (FOUNDER RULING, 2 Aug) — POINT-IN-TIME, NOT AVERAGE.
    # This carried `basis: average` and an avg() while the engine has always
    # computed point-in-time. Measured over 291 consecutive period pairs on the
    # live corpus: median gap 0.46 pp, MAXIMUM 313.54 pp, and 79 pairs (27%)
    # differing by more than a full percentage point. ROIC drives the
    # "value-creating / value-eroding" sentence, so a gap that size crosses the
    # verdict.
    #
    # RULED: the ENGINE is authoritative. avg() and the basis field are removed
    # rather than the engine changed — the specification was wrong, and no
    # rendered figure moves.
    #
    # ⭐ AND THE FIRST PERIOD RENDERS ABSENCE, NEVER THE CLOSING BALANCE. A
    # single-balance "average" is not an average; substituting the closing
    # balance would have made period one silently disagree with every other
    # period under a label claiming they were computed alike.
    formula: "is.pat / bs.equity * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Profit after tax over average shareholders' equity."

  - id: axiom.invested_capital
    name: Invested Capital
    category: Returns
    tier: core
    headline: false
    formula: "invested_capital(bs.total_debt, bs.equity, bs.preferred, bs.minority_interest, bs.cash)"
    unit: currency
    polarity: context
    basis: point_in_time
    single_owner: true
    definition: "Debt plus equity plus PREFERRED EQUITY plus minority interest
      less cash. The capital base against which ROIC is measured.
      7r.4 SPECIFICATION CORRECTION (founder ruling): preferred was missing from
      this formula and from the vocabulary, while both implementations already
      included it. Preferred is capital the business deploys — omitting it
      understates the denominator and so OVERSTATES ROIC for any company holding
      any. The code was right; the specification was wrong. No behaviour change,
      no diff owed."

  - id: axiom.roic
    name: ROIC
    category: Returns
    tier: core
    headline: true
    # ⭐⭐ R4 (FOUNDER RULING, 2 Aug) — POINT-IN-TIME, NOT AVERAGE.
    # This carried `basis: average` and an avg() while the engine has always
    # computed point-in-time. Measured over 291 consecutive period pairs on the
    # live corpus: median gap 0.46 pp, MAXIMUM 313.54 pp, and 79 pairs (27%)
    # differing by more than a full percentage point. ROIC drives the
    # "value-creating / value-eroding" sentence, so a gap that size crosses the
    # verdict.
    #
    # RULED: the ENGINE is authoritative. avg() and the basis field are removed
    # rather than the engine changed — the specification was wrong, and no
    # rendered figure moves.
    #
    # ⭐ AND THE FIRST PERIOD RENDERS ABSENCE, NEVER THE CLOSING BALANCE. A
    # single-balance "average" is not an average; substituting the closing
    # balance would have made period one silently disagree with every other
    # period under a label claiming they were computed alike.
    #
    # ⭐⭐ DEFECT 4, FIXED 2 Aug — THE MISSING `* 100`. Declared `unit: percent`
    # while its formula produced a fraction, alone among the three Returns
    # ratios. NOT A RULING: two independent constraints agree. Its own unit
    # field says percent, and axiom.eva computes (roic - wacc) / 100, a scale
    # that is only correct if both operands ALREADY arrive as percent. eva was
    # right; roic was under-specified.
    formula: "roic(is.ebit * (1 - po.tax_rate_policy), axiom.invested_capital) * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    single_owner: true
    owner_note: "FOUNDER RULING. This is the ONLY ROIC in AXIOM.
      optimization_status must consume this and must not compute its own.
      Previously it read cur['roic'] and, when incomputable, published
      'value-eroding (ROIC < WACC)' from a coerced zero."
    definition: "After-tax operating profit over average invested capital."

  - id: axiom.wacc
    name: WACC
    category: Returns
    tier: core
    headline: false
    # ⭐⭐ SCALED TO PERCENT, 2 Aug — IT RENDERED 0.1% ON MERIDIAN'S RATIO TAB.
    # `ratios.wacc_at` returns a FRACTION (0.136011). The registry tagged this
    # `unit: percent`, and the surface formats by the unit tag — so it appended
    # "%" to a fraction and printed 0.1% for a 13.6% cost of capital.
    #
    # ⭐ THE DELEGATION WAS NEVER THE DEFECT. R2 holds: wacc_at is the sole
    # owner and returns what it has always returned. What was wrong was the
    # SCALE THIS FILE DECLARED against the value it received — the same shape as
    # axiom.roic before stage 1 added its `* 100`, and now consistent with
    # roa / roe / roic, which all carry an explicit scale.
    formula: "wacc_at(po.actual_leverage) * 100"
    exposed_not_headline: true   # a rate, not a ratio; exposed to anchor the spread
    parameterised: true
    parameterised_form: "wacc_at(x) where x = D/E:
      po.cost_of_equity / (1 + x) +
      po.cost_of_debt * (1 - po.tax_rate_policy) * x / (1 + x)"
    unit: percent
    polarity: lower_better
    basis: point_in_time
    single_owner: true
    owner_note: "FOUNDER RULING, 31 Jul. ONE implementation of the blend.
      The audit found two: financials:382 (we*ke + wd*kd*(1-T)) and
      intelligence:145 (the levered-WACC-vs-D/E curve in health_reo). These
      are the same algebra in different notation — D+E basis vs D/E basis —
      not a deliberate second implementation. Both become wacc_at().
      The headline WACC is wacc_at(actual_leverage), NOT a separate
      expression that happens to agree. Book weights in v1; market weights
      when mk.market_cap exists.
      OPEN FINDING, do not fix in the consolidation session: check whether
      intelligence:145 relevers ke as x sweeps or holds it fixed. If fixed,
      the WACC-minimising point reported by the Enterprise Health Index sits
      too far right, because the equity holder is charged nothing for rising
      risk. Report; a change there moves the health index for every company
      and needs its own diff and its own ruling."
    definition: "Weighted average cost of capital at book weights."

  # --- 3. VALUE CREATION ----------------------------------------------------
  - id: axiom.roic_wacc_spread
    name: ROIC − WACC Spread
    category: Value Creation
    tier: core
    headline: true
    formula: "axiom.roic - axiom.wacc"
    unit: percent
    polarity: higher_better
    basis: average
    definition: "The value-creation spread. Positive creates economic value;
      negative erodes it."
    display_rule: "Never state 'value-eroding' unless BOTH terms computed.
      If either is an em dash, the spread is an em dash."

  - id: axiom.eva
    name: Economic Value Added
    category: Value Creation
    tier: core
    headline: false   # not in the locked 13
    # ⭐ `/ 100` BECAUSE axiom.wacc IS NOW A PERCENT. ratios.eva charges
    # capital at a FRACTION — `nopat - wacc * ic` — so the conversion happens
    # here, at the one call site that needs it, rather than by keeping the whole
    # registry on a scale that renders wrong.
    formula: "eva(is.ebit * (1 - po.tax_rate_policy), axiom.wacc / 100, axiom.invested_capital)"
    unit: currency
    polarity: higher_better
    basis: average
    single_owner: true
    exposed_not_headline: true
    owner_note: "FOUNDER RULING. §7n consumes this. engines.py:524 becomes a
      consumer, not a second computation. EVA is EXPOSED but NOT headline —
      it is a currency figure, not a ratio. Exposed so the ROIC-WACC spread
      cannot drift from its own terms."
    definition: "Spread multiplied by invested capital. Currency value
      created or destroyed in the period."

  # --- 4. LIQUIDITY ---------------------------------------------------------
  - id: axiom.current_ratio
    name: Current Ratio
    category: Liquidity
    tier: core
    headline: true
    formula: "bs.current_assets / bs.current_liabilities"
    unit: times
    polarity: band
    basis: point_in_time
    definition: "Current assets over current liabilities."
    convention: "FOUNDER RULING, 31 Jul. The denominator INCLUDES short-term
      debt, matching the incumbent behaviour at financials:312 and the
      standard definition. Stated in the explainer. An operating variant
      excluding debt would be a SEPARATELY NAMED RATIO, never a toggle — a
      toggle makes one name mean two numbers."

  - id: axiom.quick_ratio
    name: Quick Ratio
    category: Liquidity
    tier: core
    headline: false   # blocked until v9; cannot be in the 13
    formula: "(bs.current_assets - bs.inventory) / bs.current_liabilities"
    unit: times
    polarity: band
    basis: point_in_time
    availability: requires_data
    requires: ["template v9 — other_current_assets split into receivables and inventory"]
    blocked_inputs: "bs.inventory"
    definition: "Current assets excluding inventory over current liabilities."

  - id: axiom.cash_ratio
    name: Cash Ratio
    category: Liquidity
    tier: core
    headline: false
    formula: "bs.cash / bs.current_liabilities"
    unit: times
    polarity: band
    basis: point_in_time
    definition: "Cash over current liabilities. The most conservative
      liquidity measure."

  - id: axiom.cash_runway_months
    name: Cash Runway
    category: Liquidity
    tier: core
    headline: false   # not in the locked 13
    formula: "bs.cash / ((is.operating_expenses + is.cogs - is.dep_amort) / 12)"
    unit: months
    polarity: higher_better
    basis: point_in_time
    kernel_input: true
    definition: "Months of cash operating costs covered by cash on hand."
    kernel_note: "Feeds §7i as a survival-horizon constraint. Published
      distress scores do NOT feed the kernel."

  # --- 5. SOLVENCY AND LEVERAGE --------------------------------------------
  - id: axiom.net_debt
    name: Net Debt
    category: Solvency
    tier: core
    headline: false   # not in the locked 13
    formula: "net_debt(bs.total_debt, bs.cash)"
    unit: currency
    polarity: lower_better
    basis: point_in_time
    single_owner: true
    owner_note: "FOUNDER RULING. Single net debt. The valuation surface
      consumes this. Debt and cash remain SEPARATE SIGNED LINES in the
      EV-to-equity bridge — this aggregate is for ratio use, not for
      collapsing the bridge display.
      OPERANDS ARE EXPLICIT, NOT bs.total_debt. A total_debt token could
      quietly pick up leases and diverge from the sites this replaces.

      *** AMENDED 31 Jul, SEGMENT B FINDING — BINDING ON THE BUILD ***
      net_debt MUST TAKE DEBT AS AN ARGUMENT. It must NOT recompute debt from
      balance-sheet tokens.

      The Segment B trace found four _debt_book injectors and they do NOT all
      supply the same value. prescience_decision:241 injects a DELIBERATELY
      SHOCKED debt figure. _debt_book is therefore not 'total debt' — it is
      'the debt THIS computation should use'. A library that recomputes net
      debt from the balance sheet would silently UN-SHOCK every prescience
      scenario, and the scenarios would still render, still typecheck, and be
      wrong in a direction nobody would look for.

      Signature: net_debt(debt, cash) — both passed in.
      Callers supply their own debt basis. The library owns the ARITHMETIC and
      the definition; it does not own the operand source.

      The four sites still collapse to one implementation. What does not
      collapse is the right of a caller to state which debt it means."
    definition: "Total debt less cash."

  - id: axiom.debt_to_equity
    name: Debt / Equity
    category: Solvency
    tier: core
    headline: true
    formula: "bs.total_debt / bs.equity"
    unit: times
    polarity: lower_better
    basis: point_in_time
    definition: "Total debt over shareholders' equity."

  - id: axiom.debt_to_ebitda
    name: Debt / EBITDA
    category: Solvency
    tier: core
    headline: false   # not in the locked 13
    formula: "bs.total_debt / is.ebitda"
    unit: times
    polarity: lower_better
    basis: point_in_time
    definition: "Total debt as a multiple of EBITDA. The standard leverage
      covenant metric."

  - id: axiom.net_debt_to_ebitda
    name: Net Debt / EBITDA
    category: Solvency
    tier: core
    headline: true
    formula: "axiom.net_debt / is.ebitda"
    unit: times
    polarity: lower_better
    basis: point_in_time
    kernel_input: true
    definition: "Net debt as a multiple of EBITDA."

  - id: axiom.equity_ratio
    name: Equity Ratio
    category: Solvency
    tier: core
    headline: false
    formula: "bs.equity / bs.total_assets * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Equity as a percentage of total assets."

  - id: axiom.financial_leverage
    name: Financial Leverage
    category: Solvency
    tier: advanced
    headline: false
    formula: "avg(bs.total_assets) / avg(bs.equity)"
    unit: times
    polarity: context
    basis: average
    definition: "Average assets over average equity. The leverage term in
      DuPont decomposition."

  # --- 6. COVERAGE ----------------------------------------------------------
  - id: axiom.interest_coverage
    name: Interest Coverage
    category: Coverage
    tier: core
    headline: true
    formula: "is.ebit / is.interest_expense"
    unit: times
    polarity: higher_better
    basis: point_in_time
    kernel_input: true
    definition: "EBIT over interest expense. Times interest earned."

  - id: axiom.ebitda_interest_coverage
    name: EBITDA Interest Coverage
    category: Coverage
    tier: core
    headline: false
    formula: "is.ebitda / is.interest_expense"
    unit: times
    polarity: higher_better
    basis: point_in_time
    definition: "EBITDA over interest expense."

  - id: axiom.debt_service_coverage
    name: Debt Service Coverage
    category: Coverage
    tier: core
    headline: false
    formula: "is.ebitda / (is.interest_expense + cf.debt_repaid)"
    unit: times
    polarity: higher_better
    basis: point_in_time
    definition: "EBITDA over interest plus scheduled principal repayment."

  - id: axiom.cash_flow_coverage
    name: Operating Cash Flow Coverage
    category: Coverage
    tier: advanced
    headline: false
    formula: "cf.operating_cash_flow / bs.total_debt * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Operating cash flow as a percentage of total debt."

  # --- 7. EFFICIENCY --------------------------------------------------------
  - id: axiom.asset_turnover
    name: Asset Turnover
    category: Efficiency
    tier: core
    headline: false   # not in the locked 13
    formula: "is.revenue / avg(bs.total_assets)"
    unit: times
    polarity: higher_better
    basis: average
    definition: "Revenue over average total assets."

  - id: axiom.fixed_asset_turnover
    name: Fixed Asset Turnover
    category: Efficiency
    tier: advanced
    headline: false
    formula: "is.revenue / avg(bs.ppe_net)"
    unit: times
    polarity: higher_better
    basis: average
    definition: "Revenue over average net fixed assets."

  - id: axiom.inventory_turnover
    name: Inventory Turnover
    category: Efficiency
    tier: core
    headline: false
    formula: "is.cogs / avg(bs.inventory)"
    unit: times
    polarity: higher_better
    basis: average
    availability: requires_data
    requires: ["template v9 — other_current_assets split into receivables and inventory"]
    blocked_inputs: "bs.inventory"
    definition: "COGS over average inventory."

  - id: axiom.receivable_days
    name: Receivable Days (DSO)
    category: Efficiency
    tier: core
    headline: false   # blocked until v9; cannot be in the 13
    formula: "avg(bs.receivables) / is.revenue * po.days_in_period"
    unit: days
    polarity: lower_better
    basis: average
    availability: requires_data
    requires: ["template v9 — other_current_assets split into receivables and inventory"]
    blocked_inputs: "bs.receivables"
    definition: "Average days to collect receivables."

  - id: axiom.inventory_days
    name: Inventory Days (DIO)
    category: Efficiency
    tier: core
    headline: false   # blocked until v9; cannot be in the 13
    formula: "avg(bs.inventory) / is.cogs * po.days_in_period"
    unit: days
    polarity: lower_better
    basis: average
    availability: requires_data
    requires: ["template v9 — other_current_assets split into receivables and inventory"]
    blocked_inputs: "bs.inventory"
    definition: "Average days inventory is held."

  - id: axiom.payable_days
    name: Payable Days (DPO)
    category: Efficiency
    tier: core
    headline: false   # not in the locked 13
    formula: "avg(bs.payables) / is.cogs * po.days_in_period"
    unit: days
    polarity: context
    basis: average
    definition: "Average days to pay suppliers. Uses COGS as the denominator
      proxy until is.purchases is collected."
    denominator_note: "Convention choice. Purchases is the textbook
      denominator; COGS is the available one. Stated in the explainer."

  - id: axiom.cash_conversion_cycle
    name: Cash Conversion Cycle
    category: Efficiency
    tier: core
    headline: false   # blocked until v9; cannot be in the 13
    formula: "axiom.receivable_days + axiom.inventory_days - axiom.payable_days"
    unit: days
    polarity: lower_better
    basis: average
    availability: requires_data
    requires: ["template v9 — other_current_assets split into receivables and inventory"]
    blocked_inputs: "bs.receivables, bs.inventory (via DSO/DIO)"
    definition: "DSO plus DIO less DPO. Days between paying suppliers and
      collecting from customers."

  # --- 8. WORKING CAPITAL ---------------------------------------------------
  - id: axiom.working_capital
    name: Working Capital
    category: Working Capital
    tier: core
    headline: false
    formula: "bs.current_assets - bs.current_liabilities"
    unit: currency
    polarity: context
    basis: point_in_time
    definition: "Current assets less current liabilities."

  - id: axiom.working_capital_to_revenue
    name: Working Capital / Revenue
    category: Working Capital
    tier: advanced
    headline: false
    formula: "(bs.current_assets - bs.current_liabilities) / is.revenue * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    definition: "Working capital intensity of the revenue base."

  # --- 9. CASH FLOW ---------------------------------------------------------
  - id: axiom.ocf_margin
    name: Operating Cash Flow Margin
    category: Cash Flow
    tier: core
    headline: false   # not in the locked 13
    formula: "cf.operating_cash_flow / is.revenue * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "Operating cash flow as a percentage of revenue."

  - id: axiom.cash_conversion_quality
    name: Cash Conversion (OCF / EBITDA)
    category: Cash Flow
    tier: core
    headline: true
    formula: "cf.operating_cash_flow / is.ebitda * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    definition: "How much reported EBITDA arrives as operating cash. A
      persistent gap signals working capital absorption or earnings quality."
    headline_alias: "FCF conversion"
    convention: "FOUNDER RULING 31 Jul: the headline 'FCF conversion' row is
      THIS ratio — operating cash flow over EBITDA — not FCFF/EBITDA.
      MANDATORY EXPLAINER CAVEAT: operating cash flow is stated AFTER interest
      and tax; EBITDA is stated BEFORE both. The ratio therefore sits
      structurally below 100% for any leveraged taxpaying company, and it moves
      with leverage and tax rate as well as with conversion quality. It is a
      trend and peer measure, not an absolute one. A CFO who reads 72% as
      '28% of profit leaked' without that sentence has been misled by the
      label, so the sentence is not optional."
    rejected_alternative: "FCFF / EBITDA. It conflates conversion with capital
      intensity — a capex-heavy firm scores badly for reasons unrelated to how
      well profit becomes cash. That question is already answered separately by
      capex/revenue and capex/depreciation. axiom.fcff remains in the library
      as a currency line."

  - id: axiom.fcff
    name: Free Cash Flow to Firm
    category: Cash Flow
    tier: core
    headline: false   # not in the locked 13
    # ⭐⭐ R1, THE THIRD LIVE DISAGREEMENT — CORRECTED 2 Aug. This used
    # `(bs.current_assets - bs.current_liabilities)`, the INCLUSIVE basis, while
    # the engine at engines.py:462 has always used the operating one:
    #
    #     d_nwc = nwc[i] - nwc[i-1]
    #     f     = ebit*(1-T) + dep_amort - capex - d_nwc
    #     nwc   = other_current_assets - current_liabilities_ex_debt
    #
    # It sat alongside the ROIC basis and the peer ROIC as one of three
    # registry-versus-engine disagreements, and it is the one that matters most:
    # FCFF feeds the DCF and renders in the KPI strip. A bridge whose working
    # capital includes cash double-counts the cash it is trying to explain, and
    # one that includes short-term debt mixes a financing movement into an
    # operating one.
    #
    # ⭐ THE FIRST PERIOD IS ABSENT, NOT ZERO — `prior(bs.nwc)` does not exist
    # for it, and the engine appends None rather than treating "no prior" as
    # "no change". Same rule as R4's first-period ruling, reached independently.
    formula: "is.ebit * (1 - po.tax_rate_policy) + is.dep_amort - cf.capex -
              (bs.nwc - prior(bs.nwc))"
    unit: currency
    polarity: higher_better
    basis: point_in_time
    single_owner: true
    owner_note: "FOUNDER RULING. FCFF and FCFE are kept SEPARATE. Never
      substituted for one another, never labelled interchangeably."
    definition: "Cash available to all capital providers."

  - id: axiom.fcfe
    name: Free Cash Flow to Equity
    category: Cash Flow
    tier: core
    headline: false
    formula: "cf.operating_cash_flow - cf.capex + cf.debt_raised - cf.debt_repaid"
    unit: currency
    polarity: higher_better
    basis: point_in_time
    single_owner: true
    owner_note: "Separate from FCFF per founder ruling."
    definition: "Cash available to equity holders after debt service."

  - id: axiom.capex_to_revenue
    name: Capex / Revenue
    category: Cash Flow
    tier: core
    headline: false
    formula: "cf.capex / is.revenue * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    definition: "Capital intensity."

  - id: axiom.capex_to_depreciation
    name: Capex / Depreciation
    category: Cash Flow
    tier: advanced
    headline: false
    formula: "cf.capex / is.dep_amort"
    unit: times
    polarity: context
    basis: point_in_time
    definition: "Above 1.0 suggests expansion; below suggests the asset base
      is not being replaced."

  - id: axiom.maintenance_capex_ratio
    name: Maintenance Capex / Total Capex
    category: Cash Flow
    tier: advanced
    headline: false
    formula: "cf.maintenance_capex / cf.capex * 100"
    unit: percent
    polarity: lower_better
    basis: point_in_time
    availability: requires_data
    requires: ["maintenance vs growth capex split"]
    definition: "Share of capex required simply to sustain operations."

  # --- 10. GROWTH -----------------------------------------------------------
  # BASIS RULING NEEDED. Registry default: YoY headline, PoP available,
  # CAGR over full span shown separately (reuses long-run variance machinery).
  - id: axiom.revenue_growth_yoy
    name: Revenue Growth (YoY)
    category: Growth
    tier: core
    headline: true
    formula: "(is.revenue - prior(is.revenue)) / prior(is.revenue) * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    growth_basis: yoy
    definition: "Year-over-year revenue growth. For quarterly data, compares
      against the same quarter of the prior year."
    origin_note: "This is the ratio whose absence started §7r."

  - id: axiom.ebitda_growth_yoy
    name: EBITDA Growth (YoY)
    category: Growth
    tier: core
    headline: false   # not in the locked 13
    formula: "(is.ebitda - prior(is.ebitda)) / prior(is.ebitda) * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    growth_basis: yoy
    definition: "Year-over-year EBITDA growth."
    display_rule: "Sign flips are meaningless when the prior period is
      negative. Suppress and state 'prior period negative'."

  # ⭐⭐ DEFECT 5, FIXED 2 Aug. axiom.operating_leverage's formula is
  # `axiom.ebit_growth_yoy / axiom.revenue_growth_yoy` and referenced a ratio
  # that was not in the file — a canonical chain dangling into nothing. The
  # canonical_chaining ruling (7r.5) permits axiom.* chains precisely because
  # they are "a fixed, hand-audited graph"; a dangling edge is the one thing
  # that reading cannot survive.
  #
  # NOT A RULING: the definition is mechanical. Its two siblings —
  # ebitda_growth_yoy above and pat_growth_yoy below — are identical in shape,
  # unit, polarity, basis and display rule, differing only in the line they
  # measure. Written from them rather than invented.
  #
  # ⭐ THE ONE ALTERNATIVE, NAMED SO IT IS NOT SILENTLY DISMISSED: deleting
  # axiom.operating_leverage instead. Rejected — operating leverage is a real
  # ratio, nothing suggests it was withdrawn, and removing a ratio to resolve a
  # missing reference destroys the more useful of the two.
  - id: axiom.ebit_growth_yoy
    name: EBIT Growth (YoY)
    category: Growth
    tier: core
    headline: false   # not in the locked 14
    formula: "(is.ebit - prior(is.ebit)) / prior(is.ebit) * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    growth_basis: yoy
    definition: "Year-over-year EBIT growth."
    display_rule: "Sign flips are meaningless when the prior period is
      negative. Suppress and state 'prior period negative'."
    required_by: "axiom.operating_leverage — the numerator of its chain."

  - id: axiom.pat_growth_yoy
    name: PAT Growth (YoY)
    category: Growth
    tier: core
    headline: false   # not in the locked 13
    formula: "(is.pat - prior(is.pat)) / prior(is.pat) * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    growth_basis: yoy
    definition: "Year-over-year profit after tax growth."
    display_rule: "Same negative-base suppression as EBITDA growth."

  - id: axiom.revenue_cagr
    name: Revenue CAGR
    category: Growth
    tier: core
    headline: false   # not in the locked 13
    # ⭐ THIRD INSTANCE OF THE WACC DEFECT, FOUND BY THE TIGHTENED TEST RATHER
    # THAN BY A READER. `engines._cagr` returns a FRACTION; this was tagged
    # `unit: percent` and would have rendered 0.2% for 15% growth the moment it
    # computed. It was absent on the datasets checked, so nobody had seen it.
    formula: "cagr(is.revenue) * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    growth_basis: cagr
    definition: "Compound annual growth rate over the full available span.
      Span stated explicitly in the label."

  - id: axiom.operating_leverage
    name: Operating Leverage
    category: Growth
    tier: advanced
    headline: false
    formula: "axiom.ebit_growth_yoy / axiom.revenue_growth_yoy"
    unit: times
    polarity: higher_better
    basis: point_in_time
    definition: "Percentage change in EBIT per percentage change in revenue."

  # --- 11. COMMON-SIZE (separate surface, not a ratio table) ---------------
  # --- 12. DUPONT -----------------------------------------------------------
  - id: axiom.dupont_three_step
    name: DuPont Decomposition (3-step)
    category: DuPont
    tier: advanced
    headline: false
    surface: decomposition
    formula: "axiom.net_margin * axiom.asset_turnover * axiom.financial_leverage"
    unit: percent
    polarity: higher_better
    basis: average
    definition: "ROE decomposed into margin, turnover, and leverage."
    display_rule: "Must reconcile to axiom.roe. If it does not, show the
      residual rather than hiding it."

  # --- 13. DISTRESS SCREENS ------------------------------------------------
  # FOUNDER RULING: these sit BESIDE the viability kernel as an independent
  # read. They do NOT feed it. Agreement/divergence is surfaced.
  - id: axiom.altman_z
    name: Altman Z-Score (public manufacturing)
    category: Distress Screens
    tier: advanced
    headline: false
    formula: "1.2 * ((bs.current_assets - bs.current_liabilities) /
                     bs.total_assets) +
              1.4 * (bs.retained_earnings / bs.total_assets) +
              3.3 * (is.ebit / bs.total_assets) +
              0.6 * (mk.market_cap / bs.total_liabilities) +
              1.0 * (is.revenue / bs.total_assets)"
    unit: score
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["market capitalisation"]
    is_screen: true
    fitted_population: "US public manufacturers, 1960s"
    definition: "Original Altman Z. A SCREEN, not a verdict."
    display_rule: "Label as screen. Explainer must state fitted population.
      Never rendered as a solvency conclusion."

  - id: axiom.altman_z_prime
    name: Altman Z′ (private manufacturing)
    category: Distress Screens
    tier: advanced
    headline: false
    formula: "0.717 * ((bs.current_assets - bs.current_liabilities) /
                       bs.total_assets) +
              0.847 * (bs.retained_earnings / bs.total_assets) +
              3.107 * (is.ebit / bs.total_assets) +
              0.420 * (bs.equity / bs.total_liabilities) +
              0.998 * (is.revenue / bs.total_assets)"
    unit: score
    polarity: higher_better
    basis: point_in_time
    is_screen: true
    fitted_population: "Private manufacturers"
    definition: "Altman Z′ for private companies. Book equity replaces
      market cap. A SCREEN, not a verdict."

  - id: axiom.altman_z_double_prime
    name: Altman Z″ (non-manufacturing / emerging market)
    category: Distress Screens
    tier: advanced
    headline: false
    formula: "6.56 * ((bs.current_assets - bs.current_liabilities) /
                      bs.total_assets) +
              3.26 * (bs.retained_earnings / bs.total_assets) +
              6.72 * (is.ebit / bs.total_assets) +
              1.05 * (bs.equity / bs.total_liabilities)"
    unit: score
    polarity: higher_better
    basis: point_in_time
    is_screen: true
    fitted_population: "Non-manufacturing and emerging-market firms"
    definition: "Altman Z″. Asset-turnover term dropped. A SCREEN."

  - id: axiom.springate
    name: Springate Score
    category: Distress Screens
    tier: advanced
    headline: false
    formula: "1.03 * ((bs.current_assets - bs.current_liabilities) /
                      bs.total_assets) +
              3.07 * (is.ebit / bs.total_assets) +
              0.66 * (is.pbt / bs.current_liabilities) +
              0.40 * (is.revenue / bs.total_assets)"
    unit: score
    polarity: higher_better
    basis: point_in_time
    is_screen: true
    fitted_population: "Canadian industrials, 1978"
    definition: "Springate four-factor distress screen."

  - id: axiom.zmijewski
    name: Zmijewski Score
    category: Distress Screens
    tier: advanced
    headline: false
    formula: "-4.336 - 4.513 * (is.pat / bs.total_assets) +
              5.679 * (bs.total_liabilities / bs.total_assets) +
              0.004 * (bs.current_assets / bs.current_liabilities)"
    unit: score
    polarity: lower_better
    basis: point_in_time
    is_screen: true
    fitted_population: "US public firms, 1972-78"
    definition: "Zmijewski probit distress screen. Lower is safer — note the
      inverted polarity relative to Altman."

  # --- 14. HUMAN CAPITAL ---------------------------------------------------
  - id: axiom.revenue_per_employee
    name: Revenue per Employee
    category: Human Capital
    tier: advanced
    headline: false
    formula: "is.revenue / hc.headcount"
    unit: currency
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["headcount collection"]
    definition: "Revenue divided by period-end headcount."

  - id: axiom.profit_per_employee
    name: Profit per Employee
    category: Human Capital
    tier: advanced
    headline: false
    formula: "is.pat / hc.headcount"
    unit: currency
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["headcount collection"]
    definition: "Profit after tax divided by headcount."

  - id: axiom.payroll_to_revenue
    name: Payroll / Revenue
    category: Human Capital
    tier: advanced
    headline: false
    formula: "hc.payroll_cost / is.revenue * 100"
    unit: percent
    polarity: lower_better
    basis: point_in_time
    availability: requires_data
    requires: ["payroll line"]
    definition: "Payroll cost as a percentage of revenue."

  # --- 15. MARKET AND VALUATION --------------------------------------------
  - id: axiom.eps
    name: Earnings per Share
    category: Market
    tier: advanced
    headline: false
    formula: "is.pat / mk.shares_outstanding"
    unit: currency
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["share count"]
    definition: "Profit after tax per share outstanding."

  - id: axiom.pe_ratio
    name: P/E Ratio
    category: Market
    tier: advanced
    headline: false
    formula: "mk.market_cap / is.pat"
    unit: times
    polarity: context
    basis: point_in_time
    availability: requires_data
    requires: ["market capitalisation"]
    definition: "Market capitalisation over profit after tax."

  - id: axiom.ev_ebitda
    name: EV / EBITDA
    category: Market
    tier: advanced
    headline: false
    formula: "(mk.market_cap + axiom.net_debt) / is.ebitda"
    unit: times
    polarity: context
    basis: point_in_time
    availability: requires_data
    requires: ["market capitalisation"]
    definition: "Enterprise value over EBITDA."
    owner_note: "The valuation surface's editable market multiple consumes
      the same net_debt as this row. One net debt."

  - id: axiom.dividend_payout
    name: Dividend Payout Ratio
    category: Market
    tier: advanced
    headline: false
    formula: "cf.dividends_paid / is.pat * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    definition: "Dividends paid as a percentage of profit after tax."

  - id: axiom.dividend_yield
    name: Dividend Yield
    category: Market
    tier: advanced
    headline: false
    formula: "mk.dps / mk.share_price * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["dividend per share", "share price"]
    definition: "Dividend per share over share price."

  # --- 16. DEBT COMPOSITION ------------------------------------------------
  - id: axiom.short_term_debt_share
    name: Short-Term Debt Share
    category: Debt Composition
    tier: advanced
    headline: false
    formula: "bs.short_term_debt / bs.total_debt * 100"
    unit: percent
    polarity: lower_better
    basis: point_in_time
    kernel_input: true
    definition: "Share of debt maturing within twelve months. A refinancing
      exposure measure."

  - id: axiom.floating_rate_share
    name: Floating-Rate Debt Share
    category: Debt Composition
    tier: advanced
    headline: false
    formula: "bs.floating_rate_debt / bs.total_debt * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    availability: requires_data
    requires: ["debt composition — fixed/floating"]
    kernel_input: true
    definition: "Share of debt exposed to rate movements. A genuine shock
      dimension for the kernel."

  - id: axiom.secured_debt_share
    name: Secured Debt Share
    category: Debt Composition
    tier: advanced
    headline: false
    formula: "bs.secured_debt / bs.total_debt * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    availability: requires_data
    requires: ["debt composition — secured/unsecured"]
    definition: "Share of debt secured against assets."

  - id: axiom.average_cost_of_debt
    name: Average Cost of Debt (actual)
    category: Debt Composition
    tier: advanced
    headline: false
    formula: "is.interest_expense / avg(bs.total_debt) * 100"
    unit: percent
    polarity: lower_better
    basis: average
    definition: "Interest expense over average debt. The realised cost, to be
      compared against po.cost_of_debt used in WACC."

  # --- 17. EARNINGS QUALITY ------------------------------------------------
  - id: axiom.accruals_ratio
    name: Accruals Ratio
    category: Earnings Quality
    tier: advanced
    headline: false
    formula: "(is.pat - cf.operating_cash_flow) / avg(bs.total_assets) * 100"
    unit: percent
    polarity: lower_better
    basis: average
    definition: "The gap between accounting profit and operating cash,
      scaled by assets. Persistently high accruals are an earnings-quality
      warning."

  - id: axiom.bad_debt_ratio
    name: Bad Debt / Revenue
    category: Earnings Quality
    tier: advanced
    headline: false
    formula: "is.bad_debt_expense / is.revenue * 100"
    unit: percent
    polarity: lower_better
    basis: point_in_time
    availability: requires_data
    requires: ["bad debt / allowance lines"]
    definition: "Bad debt expense as a percentage of revenue."

  - id: axiom.allowance_coverage
    name: Allowance / Gross Receivables
    category: Earnings Quality
    tier: advanced
    headline: false
    formula: "bs.allowance_doubtful / (bs.receivables + bs.allowance_doubtful) * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    availability: requires_data
    requires: ["allowance line"]
    definition: "Provisioning coverage against gross receivables."

  # --- 18. REINVESTMENT ----------------------------------------------------
  - id: axiom.reinvestment_rate
    name: Reinvestment Rate
    category: Reinvestment
    tier: advanced
    headline: false
    formula: "(cf.capex - is.dep_amort +
              ((bs.current_assets - bs.current_liabilities) -
               prior(bs.current_assets - bs.current_liabilities))) /
              (is.ebit * (1 - po.tax_rate_policy)) * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    definition: "Share of after-tax operating profit reinvested in net capex
      and working capital."

  - id: axiom.sustainable_growth_rate
    name: Sustainable Growth Rate
    category: Reinvestment
    tier: advanced
    headline: false
    formula: "axiom.roe * (1 - axiom.dividend_payout / 100)"
    unit: percent
    polarity: context
    basis: average
    definition: "Growth financeable from retained earnings without changing
      leverage. Compare against axiom.revenue_growth_yoy — a company growing
      faster than this is consuming balance sheet capacity."

  - id: axiom.rd_intensity
    name: R&D Intensity
    category: Reinvestment
    tier: industry
    headline: false
    formula: "is.rd_expense / is.revenue * 100"
    unit: percent
    polarity: context
    basis: point_in_time
    availability: requires_data
    requires: ["R&D line"]
    definition: "R&D expense as a percentage of revenue."

  # --- 19. INDUSTRY-SPECIFIC: SaaS ----------------------------------------
  # All rows below are absence-by-design. These are OPERATING metrics, not
  # financial statement items, and no template collects them. They are the
  # clearest case for the client-extension mechanism below.
  - id: axiom.arr_growth
    name: ARR Growth
    category: Industry — SaaS
    tier: industry
    headline: false
    formula: "(sa.arr - prior(sa.arr)) / prior(sa.arr) * 100"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["SaaS operating metrics"]
    definition: "Year-over-year annual recurring revenue growth."

  - id: axiom.net_revenue_retention
    name: Net Revenue Retention
    category: Industry — SaaS
    tier: industry
    headline: false
    formula: "sa.nrr"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["SaaS operating metrics"]
    definition: "Revenue retained and expanded from the existing base."

  - id: axiom.cac_payback_months
    name: CAC Payback
    category: Industry — SaaS
    tier: industry
    headline: false
    formula: "sa.cac / ((sa.arr / sa.customers) * (is.gross_profit /
              is.revenue) / 12)"
    unit: months
    polarity: lower_better
    basis: point_in_time
    availability: requires_data
    requires: ["SaaS operating metrics"]
    definition: "Months of gross profit per customer to recover acquisition
      cost."

  - id: axiom.rule_of_40
    name: Rule of 40
    category: Industry — SaaS
    tier: industry
    headline: false
    formula: "axiom.arr_growth + axiom.ebitda_margin"
    unit: percent
    polarity: higher_better
    basis: point_in_time
    availability: requires_data
    requires: ["SaaS operating metrics"]
    definition: "Growth rate plus margin. Above 40 is the conventional bar."

# ---------------------------------------------------------------------------
# CLIENT EXTENSION CONTRACT
# ---------------------------------------------------------------------------
# FOUNDER REQUIREMENT: "we must allow the Client to add to his library
# (including definition and formula), since every industry has their specific
# set of ratios that they track."
#
# This is the mechanism. It is a first-class part of §7r, not an add-on.

# ⭐⭐ R3 (FOUNDER RULING, 2 Aug) — REMOVED FROM THE ARITHMETIC, KEPT ON THE
# RECORD. These three left `ratios:` and are therefore out of the count, out of
# the computability tally and out of every guard that walks formulas.
#
# They are recorded here rather than deleted because a silently vanished ratio
# is indistinguishable from one nobody thought of, and the next reader would
# have to re-derive why a registry with a Common-Size CATEGORY contains no
# common-size ratios.
withdrawn:
  - id: axiom.common_size_is
    was: "<every IS line> / is.revenue * 100"
    category: Common-Size
    ruling: "R3 — a RENDERING MODE of the statements, not a ratio family. The
      registry has no representation for a per-line family: `<every IS line>`
      is not a formula, it is a loop over a statement, and the placeholder was
      never parseable. ⭐ THE ENTRY ALREADY KNEW THIS — it carried
      `surface: full_statement` and a note reading 'A full-statement view, NOT
      a row in the ratio panel'. It described itself correctly and was filed in
      the wrong list."
    capability_unaffected: "Common-sizing is a presentation of statements that
      already exist. Nothing that renders today stops rendering."
  - id: axiom.common_size_bs
    was: "<every BS line> / bs.total_assets * 100"
    category: Common-Size
    ruling: "R3 — as above. Same shape, same reason."
    capability_unaffected: "As above."
  - id: axiom.ohlson_o
    was: "<nine-term specification — see ohlson.md>"
    category: Distress Screens
    ruling: "R3 — REMOVED AS UNSPECIFIED. ⭐ NO SOURCE IS ASSUMED TO EXIST. The
      formula referenced `ohlson.md`; the ruling is explicit that its existence
      must not be assumed, and this lane did not go looking for it in order to
      keep the entry alive. A registry entry whose specification is a filename
      nobody has read is a claim, not a definition."
    to_reinstate: "Requires the nine-term specification written out, plus the
      macro deflator the industry-context layer does not supply and two prior
      periods of net income. Its own build_note said a half-specified nine-term
      model is worse than an honest placeholder — that reasoning is why it is
      withdrawn rather than half-written."
    fitted_population: "US public firms, 1970-76 — recorded because a screen
      fitted on that population is not silently applicable to this one."

client_extension:

  scope:
    level: EID
    rule: "A client ratio library belongs to the buying entity (EID) and is
      applied across every company (CID) under it. A consulting-firm EID
      therefore builds one industry library and reuses it per client. A
      single-corporate EID sees no difference."
    per_cid_override: "A ratio may be marked applicable_to: [cid list] where
      an EID spans unlike industries."

  namespace:
    pattern: "client.<eid_slug>.<ratio_slug>"
    rule: "The axiom.* namespace is RESERVED. A client ratio can never take a
      canonical id, and can never be resolved by a canonical consumer."
    collision_behaviour: "If a client names a ratio 'ROIC', it is accepted and
      stored as client.<eid>.roic. Both render, both badged, neither
      overwrites the other. Per founder collision philosophy: surface the
      conflict for human resolution, do not auto-resolve."

  no_ratio_of_ratios:
    rule: "A client-defined ratio MAY NOT reference another ratio's output —
      neither a canonical one nor another client one. Client formulas resolve
      against `vocabulary` tokens only."
    ruling: "FOUNDER RULING, 7r.5. This is where the prohibition belongs, and it
      was previously written under evaluation.forbidden where it applied to
      everything. ⭐ THE TWO CASES ARE NOT THE SAME RISK. An arbitrary client
      chain is unbounded and unauditable: any EID may compose any ratio on any
      other, to any depth, and nobody has read the resulting graph. A canonical
      chain is a fixed graph of 77 formulas in one hand-audited file. The syntax
      is identical; the auditability is not, and the rule follows the
      auditability."
    consequence: "A client wanting ROIC − WACC states it in tokens, or asks for
      it canonically. It cannot build a private dependency on axiom.roic that a
      canonical change would silently alter underneath it."
    see: "evaluation.canonical_chaining — the permitted case."

  single_owner_protection:
    rule: "FOUNDER RULING, extended. optimization_status, §7n EVA, the
      valuation surface, and §7i may resolve ONLY ids in the axiom.*
      namespace. A client-defined ratio is display-and-report only. It cannot
      become a board-pack conclusion computed by a second owner."

  authoring_ui:
    formula_entry: picker_only
    rule: "The client never types a formula string. He composes it from:
      (a) the token vocabulary above, filtered to tokens his data actually
      contains; (b) the fixed operator set; (c) the function list. Tokens
      whose data is absent are shown greyed with the reason, so he learns
      what the template would need to collect."
    custom_inputs: "A client may declare his own input token —
      client.<eid>.input.<slug> — with a name, unit, and period basis, and
      then enter values per period. This is how a SaaS EID gets ARR, or a
      hotel EID gets RevPAR, without waiting for a template change. Declared
      inputs are the extension point that makes §19 usable."
    dry_run: mandatory
    dry_run_rule: "Save is BLOCKED until the formula evaluates against the
      current dataset and the client has seen the resulting value, the
      numerator, and the denominator for the latest actual period. A formula
      that returns an em dash may still be saved, but only after the
      'requires: X' list has been displayed and acknowledged."

  required_fields:
    - name
    - category            # existing category or client-defined
    - definition          # free text, required, surfaces in the explainer
    - formula             # composed, never typed
    - unit                # percent | times | days | currency | ratio | score | months
    - polarity            # higher_better | lower_better | band | context
    - basis               # point_in_time | average
  optional_fields:
    - target              # client's own target value
    - benchmark           # user-entered, per the v1 macro/industry layer
    - warning_threshold
    - interpretation      # management commentary
    - applicable_to       # cid list

  versioning:
    rule: "Formulas are versioned, never edited in place."
    mechanism: "Each definition carries effective_from and, on change, the
      prior definition is retained as superseded with superseded_at. Any
      period computed before the change continues to resolve against the
      definition that was effective then."
    reason: "Without this, editing a formula silently rewrites every
      historical board pack computed from it. A Q1 pack must stay
      reproducible."

  provenance:
    rule: "Every client ratio stamps created_by, created_at, and every
      subsequent version stamps changed_by, changed_at. Displayed in the
      explainer alongside the formula."
    badge: "Client-defined ratios render with a visible marker in every
      surface, including exports and board packs. A board reader must be able
      to tell an AXIOM standard definition from a house definition without
      opening the explainer."

  inherited_rules:
    - "Absence propagates. A client formula with a missing input is an em
       dash, never zero."
    - "§7p anchoring applies. A client ratio computed from forecast inputs is
       labelled forecast."
    - "§7n-A explainer applies in full. No client ratio renders without
       definition, formula, numerator, denominator, and provenance."
    - "No ratio-of-ratios in v1. A client formula may not reference another
       ratio's output. The canonical exceptions above are hand-audited; an
       arbitrary client chain is not."

  limits:
    max_ratios_per_eid: 100
    max_custom_inputs_per_eid: 50
    max_formula_tokens: 40
    reason: "Bounds the evaluation cost per dataset and keeps the authoring
      surface honest. Raise on evidence, not on request."

  promotion_path:
    status: deferred
    note: "A client industry library is a candidate AXIOM industry pack. Who
      owns a definition a client authored, and whether it can be shipped to
      other EIDs, is a commercial and IP question — not a v1 build question.
      Recorded so the data model does not foreclose it: client ratios carry a
      promotable flag defaulting to false."

# ---------------------------------------------------------------------------
# STAGING
# ---------------------------------------------------------------------------
enumeration_guard:
  status: "V1 DELIVERABLE. Ranked ABOVE the library itself — consolidation
    reduces the places to change once; only the test stops a second copy
    appearing. This shape has cost three trio-class defects in one week."
  runs: every_commit
  keys_on: arithmetic_shape
  not_keyed_on: identifier
  why: "deterministic['net_debt'] is a dict key, not an arithmetic shape, and
    is a NAME COLLISION with the ratios net_debt. An identifier-keyed check
    either false-positives on it forever or gets 'resolved' by pointing it at
    the library — the defect wearing the fix's clothes."
  shapes_detected:
    - "three-operand: short_term_debt + long_term_debt - cash"
    - "two-operand: <debt-ish operand> - cash   (valuation:135)"
    - "wrapped: _n(lambda a, b: a - b, debt, cash)"
  collision_site:
    handling: positive_assertion
    rule: "NOT a path-based skip. The skip was inert — identical counts with
      and without it, because a shape detector never matched a dict key.
      Inverted: the collision site must still exist and must not be wired to
      the library. Control: repointing it at ratios.net_debt fires
      COLLISION SITE GONE; restoring clears it."
  # ⭐ THE CORPUS SIZE, IN ONE PLACE AND ASSERTED BY TEST. It was written into
  # prose in three separate paragraphs as "79" and went stale the moment stage 1
  # made it 80. A count repeated in prose is a count that will disagree with
  # itself; `test_coverage_floor` now reads this field.
  ratio_count: 77          # 79 -> 80 (stage 1, +ebit_growth_yoy) -> 77 (R3, -3)
  withdrawn_count: 3       # see the `withdrawn:` stanza — removed, not deleted
  headline_count: 14       # locked, §7r-H — unchanged by either stage
  expected_counts:
    axiom.net_debt: 1
    axiom.roic: 2      # see peer_roic below
    axiom.wacc: 1
    axiom.eva: 1
    axiom.invested_capital: 2
  # ⭐⭐ THE GUARD NOW SCANS THIS FILE (2 Aug). It walked `.py` under
  # services/api and nothing else, so the five formulas below — which restate
  # quantities this registry itself declares single-owner — were invisible to
  # it. Under R7 the registry is read at COMPUTE TIME, at which point each is a
  # second implementation. The scan was built BEFORE anything executes.
  #
  # The exemption is tied to non-execution and MEASURED, not asserted:
  # check-sole-owner.py fails the build the day a module under services/ loads
  # this file while these formulas still restate rather than delegate.
  scans_this_file: true
  registry_duplicates:
    - axiom.net_debt
    - bs.total_debt
    - axiom.invested_capital
    - axiom.roic
    - axiom.eva
  duplicate_status: "SPECIFICATION — inert while nothing reads this file at
    runtime. Under R2 each must call its owner, as axiom.wacc already does
    (`wacc_at(actual_leverage)`). The registry already solved this for the
    hardest of the five and did not carry it to the other four."
  peer_roic:
    site: "services/api/modules/benchmarks/engines.py:100"
    ruling: "R5 (2 Aug) — KEPT, NOT ALIGNED. A peer's ROIC divides by
      total_debt + total_equity - cash: invested capital on a REDUCED BASIS,
      without preferred equity or minority interest, because peer disclosures
      rarely carry them. Aligning downward would make a company's headline ROIC
      disagree with its benchmark ROIC on the same screen. The silence was the
      defect, not the difference."
    disclosure_required: true
    enforced_by: "check-sole-owner.py label_control() — the allowlist entry is
      void if the served note stops naming the reduced basis."
  why_it_was_missed: "⭐ THE GUARD SAID 'keyed_on: arithmetic_shape,
    not_keyed_on: identifier' AND FOR ROIC THAT WAS FALSE. _roic_shape required
    operands literally NAMED `nopat` and `ic`; the peer site names neither, so
    a second ROIC read as one site and passed. check-ratio-shapes.py had
    predicted this exact failure in its own docstring — 'a second ROIC that
    computes its own denominator inline INVISIBLE' — while the instance sat in
    the tree. Fixed by resolving local names to what they were BOUND from, so
    `td + te - cash` reads as debt + equity - cash regardless of spelling."
  note: "Counts encode the TARGET state, not today's. The guard is correctly
    RED until consolidation. A guard whose expected values describe the
    current codebase is a description, not a guard."
  allowlist_coverage:
    rule: "The allowlist is a hand-synced list, so the guard asserts its own
      coverage in BOTH directions: fail if a file matches a shape and is
      absent from the allowlist, AND fail if an allowlist entry no longer
      matches. One-directional coverage is how an instrument reports clean on
      a surface it cannot see."
  standing_law:
    - "Every guard clause is tested by DELETION before it ships. An exclusion
       that changes no output is not an exclusion."
    - "An expected count is meaningless until the counter is calibrated
       against a known population. The detector once counted _n(lambda ...)
       and its own lambda body as two sites."

staging:
  v1:
    scope: "Every row with headline: true, plus both common-size statements.
      Roughly 25 rows. Plus the client extension mechanism, because the
      founder ruled it in scope and retrofitting a namespace later is worse
      than building it now."
    display: "Executive dashboard. 12-20 rows visible at a time, never the
      whole library on one screen."
    not_available_list: "Generated mechanically from availability:
      requires_data. Never render em dashes for ratios known to be
      uncomputable — list them separately with the reason."
  v2:
    scope: "tier: core remainder, DuPont, distress screens with the
      independent-read panel and agreement/divergence surfacing."
  v3:
    scope: "tier: advanced and tier: industry, as template collection
      catches up. Most of §19 will arrive via client-declared inputs before
      it arrives via the template."

